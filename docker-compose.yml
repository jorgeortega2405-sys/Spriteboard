services:
  mysql:
    image: mysql:8.0
    container_name: spriteboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: db_identity
      MYSQL_USER: sprite_user
      MYSQL_PASSWORD: sprite_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_identity.sql:/docker-entrypoint-initdb.d/01_db_identity.sql:ro
      - ./db_canvas.sql:/docker-entrypoint-initdb.d/02_db_canvas.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: spriteboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cassandra:
    image: cassandra:4.1
    container_name: spriteboard-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=SpriteboardCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./db_cassandra.cql:/init.cql:ro
      - ./db_cassandra.cql:/docker-entrypoint-initdb.d/db_cassandra.cql:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  minio:
    image: quay.io/minio/minio:latest
    container_name: spriteboard-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-spriteboard_admin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-spriteboard_secret_key}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "(echo > /dev/tcp/127.0.0.1/9000) >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  app:
    build: .
    container_name: spriteboard-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=sprite_user
      - DB_PASSWORD=sprite_password
      - DB_NAME=db_identity
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CASSANDRA_CONTACT_POINTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=spriteboard_telemetry
      - CASSANDRA_LOCAL_DC=datacenter1
      - WEBSOCKET_HOST=websocket
      - WEBSOCKET_PORT=3001
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-spriteboard_admin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-spriteboard_secret_key}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-spriteboard-storage}
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_FORCE_PATH_STYLE=true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev

  admin:
    build: ./admin
    container_name: spriteboard-admin
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3002
      - ADMIN_PORT=3002
      - CHOKIDAR_USEPOLLING=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=sprite_user
      - DB_PASSWORD=sprite_password
      - DB_NAME=db_identity
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_GOOGLE_CALLBACK_URL=http://localhost:3002/api/auth/google/callback
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./admin:/app
      - /app/node_modules
      - ./logs:/app/main_logs:ro
    command: npm run dev

  worker:
    build: ./worker
    container_name: spriteboard-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CASSANDRA_CONTACT_POINTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=spriteboard_telemetry
      - CASSANDRA_LOCAL_DC=datacenter1
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-spriteboard_admin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-spriteboard_secret_key}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-spriteboard-storage}
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_FORCE_PATH_STYLE=true
    depends_on:
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./worker:/app
      - ./data:/data

  websocket:
    build: ./websocket
    container_name: spriteboard-websocket
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - SESSION_SECRET=${SESSION_SECRET:-spriteboard_session_secret_key_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  cassandra_data:
  minio_data:

