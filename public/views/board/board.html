<div class="layout-content" data-ref="board-view">
  <div class="component-wrapper component-wrapper--full no-padding view-wrapper" data-ref="board-wrapper">
    <div class="component-top" data-ref="board-top">
      <div class="component-top-left" data-ref="board-top-left">
        <h1 class="component-top-title" data-ref="board-title">Pizarrón sin título</h1>
      </div>

      <div class="component-top-right" data-ref="board-top-right">
        <div class="design-collaborators-bar is-hidden" data-ref="board-collaborators-bar">
          <div class="design-collaborators-list" data-ref="board-collaborators-list"></div>
        </div>

        <div class="design-share-wrapper" data-ref="board-share-wrapper">
          <button type="button" class="component-button component-button--h40 component-button--black design-share-btn" data-ref="btn-share-board" data-tooltip="Compartir pizarrón" aria-label="Compartir pizarrón">
            <span class="component-icon">share</span>
            <span class="design-share-btn__text">Compartir</span>
          </button>
        </div>
      </div>
    </div>

    <div class="component-bottom component-bottom--canvas" data-ref="board-viewport">
      <div class="design-top-toolbar-container" data-ref="board-top-toolbar-container">
        <button type="button" class="design-toolbar__nav-btn design-toolbar__nav-btn--left is-disabled" data-ref="btn-top-toolbar-scroll-left" data-tooltip="Desplazar a la izquierda" aria-label="Desplazar a la izquierda">
          <span class="component-icon">chevron_left</span>
        </button>

        <div class="design-top-toolbar" data-ref="board-top-toolbar">
          <div class="design-top-toolbar__section" data-ref="board-top-toolbar-left">
            <button type="button" class="design-toolbar-btn is-disabled" data-ref="btn-undo" data-tooltip="Deshacer (Ctrl+Z)" aria-label="Deshacer" disabled>
              <span class="component-icon">undo</span>
            </button>
            <button type="button" class="design-toolbar-btn is-disabled" data-ref="btn-redo" data-tooltip="Rehacer (Ctrl+Y)" aria-label="Rehacer" disabled>
              <span class="component-icon">redo</span>
            </button>

            <div class="design-toolbar-divider"></div>

            <button type="button" class="design-toolbar-btn" data-ref="btn-top-toggle-colors" data-tooltip="Paleta de colores" aria-label="Colores">
              <span class="component-icon">palette</span>
            </button>

            <div class="design-toolbar-divider"></div>

            <div class="settings-dropdown-wrapper" data-ref="dropdown-wrapper-export">
              <button type="button" class="design-toolbar-btn" data-ref="btn-toggle-export" data-tooltip="Descargar o Exportar" aria-label="Descargar o Exportar">
                <span class="component-icon">download</span>
              </button>
              <div class="dropdown-backdrop" data-ref="backdrop-export">
                <div class="menu-panel menu-panel--dropdown menu-panel--w-240 menu-panel--h-auto" data-ref="menu-export">
                  <div class="menu-panel__drag-zone" data-ref="export-drag-zone" aria-hidden="true">
                    <div class="menu-panel__drag-handle"></div>
                  </div>
                  <div class="menu-panel__list" data-ref="list-export-options">
                    <button type="button" class="menu-item" data-ref="btn-export-png-content">
                      <span class="component-icon menu-item__icon">image</span>
                      <span class="menu-item__text">Imagen PNG (Contenido)</span>
                    </button>
                    <button type="button" class="menu-item" data-ref="btn-export-png-view">
                      <span class="component-icon menu-item__icon">crop</span>
                      <span class="menu-item__text">Imagen PNG (Vista actual)</span>
                    </button>
                    <button type="button" class="menu-item" data-ref="btn-export-svg">
                      <span class="component-icon menu-item__icon">code</span>
                      <span class="menu-item__text">Vectorial SVG</span>
                    </button>
                    <button type="button" class="menu-item" data-ref="btn-export-json">
                      <span class="component-icon menu-item__icon">data_object</span>
                      <span class="menu-item__text">Archivo JSON del proyecto</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="design-toolbar-divider"></div>

            <button type="button" class="design-toolbar-btn" data-ref="btn-clear-board" data-tooltip="Limpiar pizarrón" aria-label="Limpiar pizarrón">
              <span class="component-icon">delete_sweep</span>
            </button>
          </div>
        </div>

        <button type="button" class="design-toolbar__nav-btn design-toolbar__nav-btn--right is-disabled" data-ref="btn-top-toolbar-scroll-right" data-tooltip="Desplazar a la derecha" aria-label="Desplazar a la derecha">
          <span class="component-icon">chevron_right</span>
        </button>
      </div>
      <canvas class="design-viewport-canvas" data-ref="board-viewport-canvas"></canvas>

      <div class="board-text-editor-container" data-ref="board-text-editor-container"></div>

      <div class="board-selection-toolbar is-hidden" data-ref="board-selection-toolbar">
        <button type="button" class="design-toolbar-btn design-toolbar-btn--sm is-hidden" data-ref="btn-sel-edit-pixels" data-tooltip="Pintar píxeles" aria-label="Pintar píxeles">
          <span class="component-icon">edit</span>
        </button>
        <button type="button" class="design-toolbar-btn design-toolbar-btn--sm is-hidden" data-ref="btn-sel-toggle-grid" data-tooltip="Alternar cuadrícula" aria-label="Alternar cuadrícula">
          <span class="component-icon">grid_on</span>
        </button>
        <button type="button" class="design-toolbar-btn design-toolbar-btn--sm is-hidden" data-ref="btn-sel-export-sprite" data-tooltip="Descargar sprite PNG" aria-label="Descargar sprite PNG">
          <span class="component-icon">download</span>
        </button>
        <div class="design-toolbar-divider is-hidden" data-ref="sel-pixel-divider"></div>
        <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-sel-duplicate" data-tooltip="Duplicar (Ctrl+D)" aria-label="Duplicar">
          <span class="component-icon">content_copy</span>
        </button>
        <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-sel-bring-forward" data-tooltip="Traer al frente" aria-label="Traer al frente">
          <span class="component-icon">flip_to_front</span>
        </button>
        <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-sel-send-backward" data-tooltip="Enviar al fondo" aria-label="Enviar al fondo">
          <span class="component-icon">flip_to_back</span>
        </button>
        <div class="design-toolbar-divider"></div>
        <button type="button" class="design-toolbar-btn design-toolbar-btn--sm board-selection-action-btn--danger" data-ref="btn-sel-delete" data-tooltip="Eliminar (Supr)" aria-label="Eliminar">
          <span class="component-icon">delete_outline</span>
        </button>
      </div>

      <div class="design-colors-panel is-hidden" data-ref="board-colors-panel">
        <div class="design-colors-panel__header" data-ref="board-colors-header">
          <div class="design-colors-panel__title-box">
            <span class="component-icon">palette</span>
            <span class="design-colors-panel__title" data-ref="board-colors-title">Color de trazo</span>
          </div>
          <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-close-board-colors" data-tooltip="Cerrar" aria-label="Cerrar colores">
            <span class="component-icon">close</span>
          </button>
        </div>
        <div class="design-colors-panel__body" data-ref="board-colors-body">
          <div class="design-colors-section" data-ref="custom-colors-section">
            <div class="design-colors-section__header">
              <div class="design-colors-section__title-box">
                <span class="component-icon">palette</span>
                <span class="design-colors-section__title">Colores personalizados</span>
              </div>
              <span class="design-colors-hex" data-ref="board-colors-hex-text">#1E293B</span>
            </div>
            <div class="design-colors-custom-row">
              <div class="design-color-btn-rainbow-wrapper" data-tooltip="Elegir color personalizado">
                <input class="design-color-active-input" data-ref="input-custom-color" type="color" value="#1e293b" aria-label="Seleccionar color personalizado" />
                <div class="design-color-btn-rainbow">
                  <div class="design-color-btn-rainbow__inner">
                    <span class="component-icon">add</span>
                  </div>
                </div>
              </div>
              <div class="design-color-active-swatch-wrapper" data-tooltip="Color activo">
                <span class="design-color-active-swatch" data-ref="board-color-active-swatch" style="background-color: #1e293b;"></span>
              </div>
              <div class="design-colors-active-info">
                <input class="design-colors-text-input" data-ref="input-custom-hex" type="text" value="#1E293B" maxlength="7" placeholder="#000000" aria-label="Código hexadecimal" />
              </div>
            </div>
          </div>

          <div class="design-colors-section" data-ref="colors-ramp-section">
            <div class="design-colors-section__header">
              <div class="design-colors-section__title-box">
                <span class="component-icon">gradient</span>
                <span class="design-colors-section__title">Rampa de sombreado</span>
              </div>
            </div>
            <div class="design-colors-ramp-grid" data-ref="board-colors-ramp-grid"></div>
          </div>

          <div class="design-colors-section" data-ref="colors-recent-section">
            <div class="design-colors-section__header">
              <div class="design-colors-section__title-box">
                <span class="component-icon">history</span>
                <span class="design-colors-section__title">Colores recientes</span>
              </div>
            </div>
            <div class="design-colors-palette-grid" data-ref="board-colors-recent-grid"></div>
          </div>

          <div class="design-colors-section" data-ref="colors-default-section">
            <div class="design-colors-section__header">
              <div class="design-colors-section__title-box">
                <span class="component-icon">color_lens</span>
                <span class="design-colors-section__title">Paleta por defecto</span>
              </div>
            </div>
            <div class="design-colors-palette-grid" data-ref="board-palette-grid"></div>
          </div>
        </div>
      </div>

      <div class="design-bottom-toolbar-container" data-ref="design-toolbar-container">
        <div class="design-options-tray is-hidden" data-ref="board-options-tray">
          <div class="design-options-tray__content" data-ref="board-options-content">
            <div class="design-options-tray__group is-hidden" data-ref="options-group-shapes">
              <span class="design-options-tray__label">Forma:</span>
              <div class="design-options-tray__badges" data-ref="shapes-options-badges">
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable is-active" data-ref="shape-rect" data-shape="rect" data-tooltip="Rectángulo">
                  <span class="component-icon">crop_square</span>
                  <span>Rectángulo</span>
                </button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="shape-round-rect" data-shape="round-rect" data-tooltip="Rectángulo redondeado">
                  <span class="component-icon">rounded_corner</span>
                  <span>Redondeado</span>
                </button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="shape-circle" data-shape="circle" data-tooltip="Círculo">
                  <span class="component-icon">circle</span>
                  <span>Círculo</span>
                </button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="shape-line" data-shape="line" data-tooltip="Línea">
                  <span class="component-icon">horizontal_rule</span>
                  <span>Línea</span>
                </button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="shape-arrow" data-shape="arrow" data-tooltip="Flecha">
                  <span class="component-icon">arrow_forward</span>
                  <span>Flecha</span>
                </button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="shape-triangle" data-shape="triangle" data-tooltip="Triángulo">
                  <span class="component-icon">change_history</span>
                  <span>Triángulo</span>
                </button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="shape-star" data-shape="star" data-tooltip="Estrella">
                  <span class="component-icon">star</span>
                  <span>Estrella</span>
                </button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="shape-diamond" data-shape="diamond" data-tooltip="Rombo">
                  <span class="component-icon">square</span>
                  <span>Rombo</span>
                </button>
              </div>
            </div>

            <div class="design-options-tray__group is-hidden" data-ref="options-group-sticky">
              <span class="design-options-tray__label">Color de nota:</span>
              <div class="design-options-tray__badges" data-ref="sticky-options-badges">
                <button type="button" class="board-sticky-color-swatch is-active" data-ref="sticky-color-yellow" data-color="#fef08a" style="background-color: #fef08a;" data-tooltip="Amarillo pastel" aria-label="Amarillo"></button>
                <button type="button" class="board-sticky-color-swatch" data-ref="sticky-color-blue" data-color="#bae6fd" style="background-color: #bae6fd;" data-tooltip="Azul pastel" aria-label="Azul"></button>
                <button type="button" class="board-sticky-color-swatch" data-ref="sticky-color-green" data-color="#bbf7d0" style="background-color: #bbf7d0;" data-tooltip="Verde pastel" aria-label="Verde"></button>
                <button type="button" class="board-sticky-color-swatch" data-ref="sticky-color-pink" data-color="#fbcfe8" style="background-color: #fbcfe8;" data-tooltip="Rosa pastel" aria-label="Rosa"></button>
                <button type="button" class="board-sticky-color-swatch" data-ref="sticky-color-purple" data-color="#e9d5ff" style="background-color: #e9d5ff;" data-tooltip="Morado pastel" aria-label="Morado"></button>
                <button type="button" class="board-sticky-color-swatch" data-ref="sticky-color-orange" data-color="#fed7aa" style="background-color: #fed7aa;" data-tooltip="Naranja pastel" aria-label="Naranja"></button>
              </div>
            </div>

            <div class="design-options-tray__group is-hidden" data-ref="options-group-width">
              <span class="design-options-tray__label">Grosor de trazo:</span>
              <div class="design-options-tray__badges" data-ref="width-options-badges">
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="width-opt-2" data-width="2">2px</button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable is-active" data-ref="width-opt-4" data-width="4">4px</button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="width-opt-8" data-width="8">8px</button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="width-opt-16" data-width="16">16px</button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="width-opt-24" data-width="24">24px</button>
              </div>
            </div>

            <div class="design-options-tray__group is-hidden" data-ref="options-group-pixel">
              <span class="design-options-tray__label">Pixel:</span>
              <div class="design-options-tray__badges" data-ref="pixel-subtool-badges">
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable is-active" data-ref="pixel-tool-pencil" data-subtool="pencil" data-tooltip="Lápiz de píxel">
                  <span class="component-icon">draw</span>
                  <span>Lápiz</span>
                </button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="pixel-tool-eraser" data-subtool="eraser" data-tooltip="Goma de píxel">
                  <span class="component-icon">ink_eraser</span>
                  <span>Goma</span>
                </button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="pixel-tool-bucket" data-subtool="bucket" data-tooltip="Cubeta de relleno">
                  <span class="component-icon">format_color_fill</span>
                  <span>Relleno</span>
                </button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="pixel-tool-eyedropper" data-subtool="eyedropper" data-tooltip="Cuentagotas (I)">
                  <span class="component-icon">colorize</span>
                  <span>Gotero</span>
                </button>
              </div>

              <div class="design-toolbar-divider"></div>

              <span class="design-options-tray__label">Pincel:</span>
              <div class="design-options-tray__badges" data-ref="pixel-brush-badges">
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable is-active" data-ref="pixel-brush-1" data-pixel-brush="1">1px</button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="pixel-brush-2" data-pixel-brush="2">2px</button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="pixel-brush-4" data-pixel-brush="4">4px</button>
              </div>

              <div class="design-toolbar-divider"></div>

              <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable is-active" data-ref="btn-toggle-pixel-gridlines" data-tooltip="Ver/Ocultar cuadrícula">
                <span class="component-icon">grid_on</span>
                <span>Rejilla</span>
              </button>

              <div class="design-toolbar-divider"></div>

              <select class="board-pixel-palette-select" data-ref="select-pixel-palette" aria-label="Seleccionar paleta">
                <option value="classic">Spriteboard (36)</option>
                <option value="pico8">PICO-8 (16)</option>
                <option value="gameboy">Game Boy (4)</option>
              </select>

              <div class="board-pixel-swatches" data-ref="pixel-palette-swatches"></div>
            </div>
          </div>
          <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-close-board-options" data-tooltip="Cerrar opciones" aria-label="Cerrar opciones">
            <span class="component-icon">close</span>
          </button>
        </div>

        <div class="design-bottom-toolbar-wrapper" data-ref="board-toolbar-wrapper">
          <button type="button" class="design-toolbar__nav-btn design-toolbar__nav-btn--left is-disabled" data-ref="btn-bottom-toolbar-scroll-left" data-tooltip="Desplazar a la izquierda" aria-label="Desplazar a la izquierda">
            <span class="component-icon">chevron_left</span>
          </button>

          <div class="design-bottom-toolbar" data-ref="board-bottom-toolbar">
            <div class="design-bottom-toolbar__section design-bottom-toolbar__section--tools" data-ref="board-tools-section">
              <button type="button" class="design-toolbar-btn is-active" data-ref="tool-select" data-tool="select" data-tooltip="Seleccionar / Mover (V)" aria-label="Seleccionar">
                <span class="component-icon">near_me</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="tool-hand" data-tool="hand" data-tooltip="Mano / Desplazar (H o Espacio)" aria-label="Mano">
                <span class="component-icon">pan_tool</span>
              </button>
              <div class="design-toolbar-divider"></div>
              <button type="button" class="design-toolbar-btn" data-ref="tool-pen" data-tool="pen" data-tooltip="Pluma suave (P)" aria-label="Pluma suave">
                <span class="component-icon">draw</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="tool-marker" data-tool="marker" data-tooltip="Marcador (M)" aria-label="Marcador">
                <span class="component-icon">brush</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="tool-highlighter" data-tool="highlighter" data-tooltip="Resaltador (R)" aria-label="Resaltador">
                <span class="component-icon">ink_highlighter</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="tool-eraser" data-tool="eraser" data-tooltip="Borrador (E)" aria-label="Borrador">
                <span class="component-icon">ink_eraser</span>
              </button>
              <div class="design-toolbar-divider"></div>
              <button type="button" class="design-toolbar-btn" data-ref="tool-shapes" data-tool="shapes" data-tooltip="Formas y flechas (S)" aria-label="Formas">
                <span class="component-icon">shapes</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="tool-sticky" data-tool="sticky" data-tooltip="Nota adhesiva (N)" aria-label="Nota adhesiva">
                <span class="component-icon">sticky_note_2</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="tool-text" data-tool="text" data-tooltip="Texto (T)" aria-label="Texto">
                <span class="component-icon">text_fields</span>
              </button>
              <div class="design-toolbar-divider"></div>
              <button type="button" class="design-toolbar-btn" data-ref="tool-pixel" data-tool="pixel" data-tooltip="Lápiz de píxeles (X)" aria-label="Lápiz de píxeles">
                <span class="component-icon">draw</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="btn-insert-pixel-grid" data-tooltip="Insertar cuadrícula Pixel Art" aria-label="Insertar cuadrícula Pixel Art">
                <span class="component-icon">grid_on</span>
              </button>
              <div class="design-toolbar-divider"></div>

              <button type="button" class="design-toolbar-btn" data-ref="btn-color-prop" data-tooltip="Color de trazo" aria-label="Color de trazo">
                <span class="design-color-picker__preview" data-ref="color-swatch-circle" style="background-color: #1e293b;"></span>
              </button>
              <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="btn-width-prop" data-tooltip="Grosor de trazo" aria-label="Grosor de trazo">
                <span class="board-width-dot" data-ref="width-dot-indicator"></span>
                <span class="design-toolbar-badge__text" data-ref="width-label">4px</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="btn-fill-prop" data-tooltip="Color de relleno" aria-label="Color de relleno">
                <span class="component-icon">format_color_fill</span>
                <span class="board-fill-preview-dot" data-ref="fill-swatch-circle"></span>
              </button>
            </div>

            <div class="design-bottom-toolbar__section design-bottom-toolbar__section--zoom" data-ref="board-zoom-section">
              <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-zoom-out" data-tooltip="Alejar (Ctrl -)" aria-label="Alejar">
                <span class="component-icon">remove</span>
              </button>
              <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="btn-zoom-reset" data-tooltip="Restablecer zoom (100%)" aria-label="Restablecer zoom">
                <span class="design-toolbar-badge__text" data-ref="board-zoom-value">100%</span>
              </button>
              <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-zoom-in" data-tooltip="Acercar (Ctrl +)" aria-label="Acercar">
                <span class="component-icon">add</span>
              </button>
              <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-zoom-fit" data-tooltip="Ajustar a contenido" aria-label="Ajustar a contenido">
                <span class="component-icon">fit_screen</span>
              </button>
            </div>
          </div>

          <button type="button" class="design-toolbar__nav-btn design-toolbar__nav-btn--right is-disabled" data-ref="btn-bottom-toolbar-scroll-right" data-tooltip="Desplazar a la derecha" aria-label="Desplazar a la derecha">
            <span class="component-icon">chevron_right</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
