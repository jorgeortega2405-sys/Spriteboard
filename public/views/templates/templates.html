<div class="layout-content" data-ref="templates-view">
  <div class="component-wrapper component-wrapper--full home-wrapper" data-ref="templates-wrapper">
    <div class="layout-body layout-body--scrollable layout-scrollable home-scrollable" data-ref="templates-scrollable">
      <div class="home-container" data-ref="templates-container">
        <div class="home-gradient-backdrop" data-ref="templates-gradient-backdrop"></div>
        <div class="home-hero templates-hero" data-ref="templates-hero">
          <div class="home-hero__content">
            <h1 class="home-hero__title" data-ref="templates-hero-title" data-i18n="templates.title">Plantillas</h1>
            <div class="home-search-pill templates-search-pill" data-ref="templates-search-box">
              <span class="material-symbols-rounded home-search-pill__icon">search</span>
              <input class="home-search-pill__input" data-ref="templates-search-input" type="text" placeholder="Busca en miles de plantillas" autocomplete="off" />
              <button type="button" class="btn btn--h32 btn--icon home-search-pill__clear" data-ref="btn-templates-clear-search" style="display: none;" aria-label="Limpiar búsqueda">
                <span class="material-symbols-rounded" style="font-size: 18px;">close</span>
              </button>
            </div>
            <div class="component-tags-carousel-wrapper templates-tags-wrapper" data-ref="templates-tags-carousel-wrapper">
              <button type="button" class="component-tag-nav-btn component-tag-nav-left is-disabled" data-ref="btn-tags-scroll-left" data-tooltip="Desplazar categorías a la izquierda" aria-label="Desplazar categorías a la izquierda">
                <span class="material-symbols-rounded">chevron_left</span>
              </button>

              <div class="component-tags-carousel" data-ref="templates-categories-badges"></div>

              <button type="button" class="component-tag-nav-btn component-tag-nav-right is-disabled" data-ref="btn-tags-scroll-right" data-tooltip="Desplazar categorías a la derecha" aria-label="Desplazar categorías a la derecha">
                <span class="material-symbols-rounded">chevron_right</span>
              </button>
            </div>
          </div>
        </div>

        <div class="canvas-section" data-ref="templates-section">
          <div class="templates-grid" data-ref="templates-grid"></div>
          <div class="infinite-scroll-sentinel" data-ref="templates-sentinel" style="display: none;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
