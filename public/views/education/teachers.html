<div class="layout-content" data-ref="education-teachers-view">
  <div class="component-wrapper component-wrapper--full home-wrapper view-wrapper" data-ref="education-wrapper">
    <div class="home-floating-top" data-ref="component-top">
      <div class="home-floating-top__left" data-ref="component-top-left">
        <h1 class="section-floating-title" data-ref="education-title" data-i18n="education.tab_teachers">Docentes</h1>
      </div>

      <div class="home-floating-top__right" data-ref="component-top-right">
        <div class="home-floating-actions" data-ref="teachers-top-actions">
          <button type="button" class="component-button component-button--h40 component-button--icon-only home-floating-btn" data-ref="btn-toggle-search" data-tooltip="Buscar docentes" aria-label="Buscar docentes">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          </button>
          <button type="button" class="component-button component-button--h40 component-button--icon-only home-floating-btn" data-ref="btn-add-teacher" data-tooltip="Vincular docente" aria-label="Vincular docente">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#person_add"></use></svg>
          </button>
        </div>

        <div class="canvas-section__dropdown-wrapper home-filter-dropdown-wrapper" data-ref="education-tab-filter-wrapper">
          <button type="button" class="component-button component-button--h40 component-button--icon-only home-floating-btn" data-ref="btn-trigger-education-filter" data-tooltip="Filtrar vista" aria-label="Filtrar vista">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
          </button>
          <div class="dropdown-backdrop" data-ref="dropdown-backdrop-education-filter">
            <div class="menu-panel menu-panel--dropdown menu-panel--w-200 menu-panel--h-auto" data-ref="dropdown-menu-education-filter">
              <div class="menu-panel__drag-zone" data-ref="drag-zone-education-filter" aria-hidden="true">
                <div class="menu-panel__drag-handle"></div>
              </div>
              <div class="menu-panel__list">
                <button type="button" class="menu-item" data-ref="tab-btn-classrooms" data-tab="classrooms">
                  <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#meeting_room"></use></svg>
                  <span class="menu-item__text" data-i18n="education.tab_classrooms">Salones y aulas</span>
                </button>
                <button type="button" class="menu-item is-active" data-ref="tab-btn-teachers" data-tab="teachers">
                  <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#school"></use></svg>
                  <span class="menu-item__text" data-i18n="education.tab_teachers">Docentes</span>
                </button>
                <button type="button" class="menu-item" data-ref="tab-btn-school" data-tab="school">
                  <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#apartment"></use></svg>
                  <span class="menu-item__text" data-i18n="education.tab_school">Institución</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
        <div class="component-search component-search--full" data-ref="search-box">
          <div class="component-search__icon" data-ref="search-icon">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          </div>
          <div class="component-search__input-box" data-ref="search-input-box">
            <input class="component-search__input" data-ref="education-search-input" data-i18n-placeholder="education.search_teachers_placeholder" type="text" maxlength="100" autocomplete="off" />
          </div>
          <button type="button" class="component-button component-button--h34 component-button--icon-only" data-ref="btn-clear-search" style="display: none; margin-right: 4px;" aria-label="Limpiar búsqueda">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="component-bottom component-bottom--no-padding" data-ref="component-bottom">
      <div class="component-table-wrapper" data-ref="teachers-table-wrapper">
        <table class="component-table" data-ref="teachers-table">
          <thead class="component-table__head" data-ref="teachers-thead">
            <tr>
              <th data-ref="th-faculty-teacher" data-i18n="education.col_teacher">Docente</th>
              <th data-ref="th-faculty-email" data-i18n="education.col_email">Correo institucional</th>
              <th data-ref="th-faculty-status" data-i18n="education.col_status">Estado</th>
              <th data-ref="th-faculty-joined" data-i18n="education.col_joined">Fecha de alta</th>
              <th data-ref="th-faculty-actions" style="text-align: right;" data-i18n="education.col_actions">Acciones</th>
            </tr>
          </thead>
          <tbody class="component-table__body" data-ref="teachers-tbody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal para vincular docente a la institución -->
  <div class="modal-backdrop" data-ref="modal-teacher-backdrop">
    <div class="modal-container" data-ref="modal-teacher-container">
      <button type="button" class="modal-close-btn" data-ref="btn-close-teacher-modal" aria-label="Cerrar modal">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
      </button>
      <div class="modal-card modal-card--w-520" data-ref="modal-teacher-card">
        <div class="modal-card__header">
          <h2 class="modal-card__title" data-ref="modal-teacher-title" data-i18n="education.add_teacher_title">Vincular nuevo docente</h2>
        </div>
        <form class="modal-card__body" data-ref="form-teacher">
          <p class="component-disclaimer__text" style="margin-bottom: 16px;" data-i18n="education.add_teacher_desc">Ingresa el nombre de usuario o correo de la cuenta de Spriteboard que deseas registrar como docente de tu institución educativa.</p>
          <label class="field" data-ref="field-teacher-query">
            <input class="field__input" data-ref="input-teacher-query" type="text" placeholder=" " maxlength="150" autocomplete="off" required />
            <span class="field__label" data-ref="label-teacher-query" data-i18n="education.add_teacher_input_label">Nombre de usuario o correo</span>
          </label>
          <div class="modal-card__actions">
            <button type="button" class="component-button component-button--h40 component-button--outline" data-ref="btn-cancel-teacher" data-i18n="modal.cancel">Cancelar</button>
            <button type="submit" class="component-button component-button--h40 component-button--black" data-ref="btn-submit-teacher" data-i18n="education.add_teacher_submit">Vincular docente</button>
          </div>
          <div class="banner banner--danger is-hidden" data-ref="banner-teacher-error"></div>
        </form>
      </div>
    </div>
  </div>
</div>
