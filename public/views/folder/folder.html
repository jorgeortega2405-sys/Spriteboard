<div class="layout-content" data-ref="folder-view">
  <div class="component-wrapper component-wrapper--full view-wrapper" data-ref="folder-wrapper">
    <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="folder-scrollable">
      <div class="view-body" data-ref="folder-container">
        <div class="view-backdrop" data-ref="folder-gradient-backdrop"></div>
        <div class="view-header" data-ref="folder-floating-top">
          <div class="view-header__left" data-ref="folder-floating-left">
            <div class="view-header__title" data-ref="folder-title-container">
              <span class="view-header__title-prefix" data-ref="folder-title-prefix" data-i18n="canvas.folder_viewing_prefix">Consultando carpeta:</span>
              <span class="view-header__title-name" data-ref="folder-title-name"></span>
            </div>
          </div>

          <div class="view-header__right" data-ref="folder-floating-right">
            <div class="view-header__actions" data-ref="folder-context-actions">
              <div class="canvas-section__dropdown-wrapper home-filter-dropdown-wrapper" data-ref="folder-dropdown-wrapper-type">
                <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-folder-trigger-filter-type" data-tooltip="Filtrar" aria-label="Filtrar">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
                </button>
                <div class="dropdown-backdrop" data-ref="dropdown-backdrop-folder-filter-type">
                  <div class="menu-panel menu-panel--dropdown menu-panel--w-180 menu-panel--h-auto" data-ref="dropdown-menu-folder-filter-type">
                    <div class="menu-panel__drag-zone" data-ref="drag-zone-folder-filter-type" aria-hidden="true">
                      <div class="menu-panel__drag-handle"></div>
                    </div>
                    <div class="menu-panel__list">
                      <button type="button" class="menu-item is-active" data-ref="folder-menu-filter-type-all" data-value="all">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#dashboard"></use></svg>
                        <span class="menu-item__text">Cualquiera</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="folder-menu-filter-type-designs" data-value="designs">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#draw"></use></svg>
                        <span class="menu-item__text">Diseños</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="canvas-section__dropdown-wrapper home-filter-dropdown-wrapper" data-ref="folder-dropdown-wrapper-sort">
                <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-folder-trigger-sort" data-tooltip="Ordenar" aria-label="Ordenar">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#swap_vert"></use></svg>
                </button>
                <div class="dropdown-backdrop" data-ref="dropdown-backdrop-folder-sort">
                  <div class="menu-panel menu-panel--dropdown menu-panel--w-220 menu-panel--h-auto" data-ref="dropdown-menu-folder-sort">
                    <div class="menu-panel__drag-zone" data-ref="drag-zone-folder-sort" aria-hidden="true">
                      <div class="menu-panel__drag-handle"></div>
                    </div>
                    <div class="menu-panel__list">
                      <button type="button" class="menu-item is-active" data-ref="folder-menu-sort-activity" data-value="activity">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#schedule"></use></svg>
                        <span class="menu-item__text">Última actividad</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="folder-menu-sort-alpha-asc" data-value="alpha-asc">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#sort_by_alpha"></use></svg>
                        <span class="menu-item__text">Orden alfabético (A-Z)</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="folder-menu-sort-alpha-desc" data-value="alpha-desc">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#sort_by_alpha"></use></svg>
                        <span class="menu-item__text">Orden alfabético (Z-A)</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-folder-rename" data-tooltip="Renombrar carpeta" aria-label="Renombrar carpeta">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#edit"></use></svg>
              </button>
              <button type="button" class="component-button component-button--h40 component-button--danger component-button--icon-only view-header__btn" data-ref="btn-folder-delete" data-tooltip="Eliminar carpeta" aria-label="Eliminar carpeta">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete"></use></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="canvas-section" data-ref="canvas-section">
          <div class="canvas-grid" data-ref="canvas-grid"></div>
          <div class="infinite-scroll-sentinel" data-ref="canvas-sentinel" style="display: none;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
