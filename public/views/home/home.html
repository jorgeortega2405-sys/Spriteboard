<div class="layout-content" data-ref="home-view">
  <div class="component-wrapper component-wrapper--full view-wrapper" data-ref="home-wrapper">
    <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="home-scrollable">
      <div class="view-body" data-ref="home-container">
        <div class="view-backdrop" data-ref="home-gradient-backdrop"></div>
        <div class="view-header" data-ref="home-floating-top">
          <div class="view-header__left" data-ref="home-floating-left">
            <h1 class="view-header__title" data-ref="home-title" data-i18n="canvas.home_title" style="display: none;">Tus centros de trabajo</h1>
            <div class="view-breadcrumb" data-ref="folder-title-container" style="display: none;">
              <button type="button" class="component-button component-button--h34 component-button--icon-only view-breadcrumb__back" data-ref="btn-folder-back" data-tooltip="Volver al inicio" aria-label="Volver al inicio">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#arrow_back"></use></svg>
              </button>
              <div class="view-breadcrumb__info" data-ref="folder-breadcrumb-info">
                <span class="view-breadcrumb__prefix" data-i18n="canvas.folder_viewing_prefix">Carpeta:</span>
                <span class="view-breadcrumb__name" data-ref="folder-title-name"></span>
              </div>
            </div>
          </div>

          <div class="view-header__right" data-ref="home-floating-right">
            <div class="view-header__actions" data-ref="home-default-actions">
              <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-home-upgrade" data-tooltip="Mejorar plan" aria-label="Mejorar plan">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#workspace_premium"></use></svg>
              </button>
              <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-create-folder" data-tooltip="Crear carpeta" aria-label="Crear carpeta">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#create_new_folder"></use></svg>
              </button>
            </div>

            <div class="view-header__actions" data-ref="folder-context-actions" style="display: none;">
              <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-folder-rename" data-tooltip="Renombrar carpeta" aria-label="Renombrar carpeta">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#edit"></use></svg>
              </button>
              <button type="button" class="component-button component-button--h40 component-button--danger component-button--icon-only view-header__btn" data-ref="btn-folder-delete" data-tooltip="Eliminar carpeta" aria-label="Eliminar carpeta">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete"></use></svg>
              </button>
            </div>
          </div>

          <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
            <div class="component-search component-search--full" data-ref="search-box">
              <div class="component-search__icon" data-ref="search-icon">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
              </div>
              <div class="component-search__input-box" data-ref="search-input-box">
                <input class="component-search__input" data-ref="home-search-input" data-i18n-placeholder="canvas.home_search_placeholder" type="text" maxlength="100" autocomplete="off" />
              </div>
              <button type="button" class="component-button component-button--h34 component-button--icon-only" data-ref="btn-clear-search" style="display: none; margin-right: 4px;" aria-label="Limpiar búsqueda">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="view-hero" data-ref="home-hero">
          <div class="view-hero__content">
            <h1 class="view-hero__title" data-ref="hero-title">¿Qué te gustaría crear hoy?</h1>

            <div class="view-search-pill" data-ref="hero-search-box">
              <svg class="component-icon view-search-pill__icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
              <input class="view-search-pill__input" data-ref="hero-search-input" type="text" placeholder="Busca lo que quieras" autocomplete="off" />
              <button type="button" class="component-button component-button--h32 component-button--icon-only view-search-pill__clear" data-ref="btn-hero-clear-search" style="display: none;" aria-label="Limpiar búsqueda">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
              </button>
            </div>

            <div class="component-tags-carousel-wrapper view-tags-wrapper" data-ref="home-categories-carousel-wrapper">
              <div class="component-tags-carousel" data-ref="home-categories-row">
                <button type="button" class="component-badge component-badge--interactive is-active" data-ref="cat-badge-all" data-category="all">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#auto_awesome" xlink:href="/icons.svg#auto_awesome"></use></svg>
                  <span>Para ti</span>
                </button>
                <button type="button" class="component-badge component-badge--interactive" data-ref="cat-badge-board" data-category="board">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#dashboard" xlink:href="/icons.svg#dashboard"></use></svg>
                  <span>Pizarrón</span>
                </button>
                <button type="button" class="component-badge component-badge--interactive" data-ref="cat-badge-doc" data-category="doc">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#description" xlink:href="/icons.svg#description"></use></svg>
                  <span>Documentos</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="canvas-section" data-ref="canvas-section">
          <div class="canvas-section__header" data-ref="canvas-section-header">
            <h2 class="canvas-section__title" data-ref="canvas-section-title">Recientes</h2>
            <div class="canvas-section__controls home-section-controls" data-ref="home-section-controls">
              <div class="canvas-section__dropdown-wrapper home-filter-dropdown-wrapper" data-ref="home-dropdown-wrapper-type">
                <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="btn-trigger-filter-type" data-tooltip="Filtrar" aria-label="Filtrar">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
                </button>
                <div class="dropdown-backdrop" data-ref="dropdown-backdrop-filter-type">
                  <div class="menu-panel menu-panel--dropdown menu-panel--w-180 menu-panel--h-auto" data-ref="dropdown-menu-filter-type">
                    <div class="menu-panel__drag-zone" data-ref="drag-zone-filter-type" aria-hidden="true">
                      <div class="menu-panel__drag-handle"></div>
                    </div>
                    <div class="menu-panel__list">
                      <button type="button" class="menu-item is-active" data-ref="menu-filter-type-all" data-value="all">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#dashboard"></use></svg>
                        <span class="menu-item__text">Cualquiera</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="menu-filter-type-designs" data-value="designs">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#draw"></use></svg>
                        <span class="menu-item__text">Diseños</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="menu-filter-type-folders" data-value="folders">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#folder"></use></svg>
                        <span class="menu-item__text">Carpetas</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="canvas-section__dropdown-wrapper home-filter-dropdown-wrapper" data-ref="home-dropdown-wrapper-sort">
                <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="btn-trigger-sort" data-tooltip="Ordenar" aria-label="Ordenar">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#swap_vert"></use></svg>
                </button>
                <div class="dropdown-backdrop" data-ref="dropdown-backdrop-sort">
                  <div class="menu-panel menu-panel--dropdown menu-panel--w-220 menu-panel--h-auto" data-ref="dropdown-menu-sort">
                    <div class="menu-panel__drag-zone" data-ref="drag-zone-sort" aria-hidden="true">
                      <div class="menu-panel__drag-handle"></div>
                    </div>
                    <div class="menu-panel__list">
                      <button type="button" class="menu-item is-active" data-ref="menu-sort-activity" data-value="activity">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#schedule"></use></svg>
                        <span class="menu-item__text">Última actividad</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="menu-sort-alpha-asc" data-value="alpha-asc">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#sort_by_alpha"></use></svg>
                        <span class="menu-item__text">Orden alfabético (A-Z)</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="menu-sort-alpha-desc" data-value="alpha-desc">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#sort_by_alpha"></use></svg>
                        <span class="menu-item__text">Orden alfabético (Z-A)</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="canvas-grid" data-ref="canvas-grid"></div>
          <div class="infinite-scroll-sentinel" data-ref="canvas-sentinel" style="display: none;"></div>
        </div>

        <div class="canvas-section" data-ref="templates-section" style="display: none;">
          <div class="canvas-section__header" data-ref="templates-section-header">
            <h2 class="canvas-section__title" data-ref="templates-section-title" data-i18n="templates.section_title">Explorar plantillas</h2>
            <div class="canvas-section__controls home-section-controls" data-ref="templates-section-controls">
              <div class="canvas-section__dropdown-wrapper home-filter-dropdown-wrapper" data-ref="templates-dropdown-wrapper-type">
                <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="btn-trigger-filter-type" data-tooltip="Filtrar" aria-label="Filtrar">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
                </button>
                <div class="dropdown-backdrop" data-ref="dropdown-backdrop-filter-type">
                  <div class="menu-panel menu-panel--dropdown menu-panel--w-180 menu-panel--h-auto" data-ref="dropdown-menu-filter-type">
                    <div class="menu-panel__drag-zone" data-ref="drag-zone-filter-type" aria-hidden="true">
                      <div class="menu-panel__drag-handle"></div>
                    </div>
                    <div class="menu-panel__list">
                      <button type="button" class="menu-item is-active" data-ref="menu-filter-type-all" data-value="all">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#dashboard"></use></svg>
                        <span class="menu-item__text" data-i18n="templates.filter_all">Todas</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="menu-filter-type-favorites" data-value="favorites">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#star"></use></svg>
                        <span class="menu-item__text" data-i18n="templates.filter_favorites">Favoritas</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="menu-filter-type-pixel" data-value="pixel">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#brush"></use></svg>
                        <span class="menu-item__text" data-i18n="templates.filter_pixel">Pixel Art</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="menu-filter-type-board" data-value="board">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#draw"></use></svg>
                        <span class="menu-item__text" data-i18n="templates.filter_board">Pizarrón</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="canvas-section__dropdown-wrapper home-filter-dropdown-wrapper" data-ref="templates-dropdown-wrapper-sort">
                <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="btn-trigger-sort" data-tooltip="Ordenar" aria-label="Ordenar">
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#swap_vert"></use></svg>
                </button>
                <div class="dropdown-backdrop" data-ref="dropdown-backdrop-sort">
                  <div class="menu-panel menu-panel--dropdown menu-panel--w-220 menu-panel--h-auto" data-ref="dropdown-menu-sort">
                    <div class="menu-panel__drag-zone" data-ref="drag-zone-sort" aria-hidden="true">
                      <div class="menu-panel__drag-handle"></div>
                    </div>
                    <div class="menu-panel__list">
                      <button type="button" class="menu-item is-active" data-ref="menu-sort-default" data-value="default">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#auto_awesome"></use></svg>
                        <span class="menu-item__text" data-i18n="templates.sort_recommended">Recomendadas</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="menu-sort-alpha-asc" data-value="alpha-asc">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#sort_by_alpha"></use></svg>
                        <span class="menu-item__text" data-i18n="templates.sort_alpha_asc">Orden alfabético (A-Z)</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="menu-sort-alpha-desc" data-value="alpha-desc">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#sort_by_alpha"></use></svg>
                        <span class="menu-item__text" data-i18n="templates.sort_alpha_desc">Orden alfabético (Z-A)</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="menu-sort-size-desc" data-value="size-desc">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#aspect_ratio"></use></svg>
                        <span class="menu-item__text" data-i18n="templates.sort_size_desc">Mayor tamaño</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="menu-sort-size-asc" data-value="size-asc">
                        <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#aspect_ratio"></use></svg>
                        <span class="menu-item__text" data-i18n="templates.sort_size_asc">Menor tamaño</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="canvas-grid templates-grid" data-ref="templates-grid"></div>
          <div class="infinite-scroll-sentinel" data-ref="templates-sentinel" style="display: none;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
