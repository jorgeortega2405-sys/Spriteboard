<div class="layout-content" data-ref="home-view">
  <div class="component-wrapper component-wrapper--full" data-ref="home-wrapper">
    <!-- Component Top -->
    <div class="component-top" data-ref="component-top">
      <div class="component-top-left" data-ref="component-top-left">
        <h1 class="component-top-title" data-ref="home-title" data-i18n="canvas.home_title">Tus centros de trabajo</h1>
        <div class="breadcrumbs" data-ref="home-breadcrumbs" style="display: none;">
          <button type="button" class="btn btn--h40 btn--icon" data-ref="btn-back-home" data-tooltip="Volver a inicio" aria-label="Volver a inicio" style="margin-right: 4px;">
            <span class="material-symbols-rounded">arrow_back</span>
          </button>
          <span class="breadcrumb-link" data-ref="breadcrumb-root" data-i18n="canvas.home_title">Tus centros de trabajo</span>
          <span class="material-symbols-rounded breadcrumb-separator">navigate_next</span>
          <span class="breadcrumb-current" data-ref="breadcrumb-folder-name"></span>
        </div>
      </div>

      <div class="component-top-right" data-ref="component-top-right">
        <!-- Acciones por defecto -->
        <div class="component-top-actions" data-ref="home-default-actions">
          <button type="button" class="btn btn--h40 btn--icon" data-ref="btn-create-folder" data-tooltip="Crear carpeta" aria-label="Crear carpeta">
            <span class="material-symbols-rounded">create_new_folder</span>
          </button>
          <button type="button" class="btn btn--h40 btn--icon" data-ref="btn-toggle-search" data-tooltip="Buscar lienzos" aria-label="Buscar lienzos">
            <span class="material-symbols-rounded">search</span>
          </button>
        </div>

        <!-- Acciones contextuales dentro de carpeta -->
        <div class="component-top-actions" data-ref="folder-context-actions" style="display: none;">
          <button type="button" class="btn btn--h40 btn--icon" data-ref="btn-folder-rename" data-tooltip="Renombrar carpeta" aria-label="Renombrar carpeta">
            <span class="material-symbols-rounded">edit</span>
          </button>
          <button type="button" class="btn btn--h40 btn--danger btn--icon" data-ref="btn-folder-delete" data-tooltip="Eliminar carpeta" aria-label="Eliminar carpeta">
            <span class="material-symbols-rounded">delete</span>
          </button>
        </div>
      </div>

      <!-- Toolbar de búsqueda flotante -->
      <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
        <div class="component-search component-search--full" data-ref="search-box">
          <div class="component-search__icon" data-ref="search-icon">
            <span class="material-symbols-rounded">search</span>
          </div>
          <div class="component-search__input-box" data-ref="search-input-box">
            <input class="component-search__input" data-ref="home-search-input" data-i18n-placeholder="canvas.home_search_placeholder" type="text" maxlength="100" autocomplete="off" />
          </div>
          <button type="button" class="btn btn--h34 btn--icon btn--clear-search" data-ref="btn-clear-search" style="display: none; margin-right: 4px;" aria-label="Limpiar búsqueda">
            <span class="material-symbols-rounded" style="font-size: 18px;">close</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Component Bottom -->
    <div class="component-bottom component-bottom--no-padding" data-ref="component-bottom">
      <div class="layout-body layout-body--scrollable layout-scrollable" data-ref="home-scrollable">
        <div class="canvas-section" data-ref="canvas-section">
          <div class="canvas-grid" data-ref="canvas-grid"></div>
          <div class="infinite-scroll-sentinel" data-ref="canvas-sentinel" style="display: none;"></div>
        </div>
      </div>
    </div>

    <div class="selection-toolbar is-hidden" data-ref="selection-toolbar">
      <div class="selection-toolbar__left" data-ref="selection-toolbar-left">
        <button type="button" class="btn btn--icon btn--h34 selection-toolbar__btn selection-toolbar__btn--close" data-ref="btn-selection-close" data-tooltip="Cancelar selección" aria-label="Cancelar selección">
          <span class="material-symbols-rounded">close</span>
        </button>
        <span class="selection-toolbar__count" data-ref="selection-count">0 seleccionados</span>
      </div>
      <div class="selection-toolbar__divider" data-ref="selection-toolbar-divider"></div>
      <div class="selection-toolbar__actions" data-ref="selection-toolbar-actions">
        <button type="button" class="btn btn--icon btn--h34 selection-toolbar__btn" data-ref="btn-selection-download" data-tooltip="Descargar" aria-label="Descargar">
          <span class="material-symbols-rounded">download</span>
        </button>
        <button type="button" class="btn btn--icon btn--h34 selection-toolbar__btn" data-ref="btn-selection-move" data-tooltip="Mover a carpeta" aria-label="Mover a carpeta">
          <span class="material-symbols-rounded">drive_file_move</span>
        </button>
        <button type="button" class="btn btn--icon btn--h34 selection-toolbar__btn" data-ref="btn-selection-duplicate" data-tooltip="Duplicar" aria-label="Duplicar">
          <span class="material-symbols-rounded">filter_none</span>
        </button>
        <button type="button" class="btn btn--icon btn--h34 btn--danger-hover selection-toolbar__btn" data-ref="btn-selection-delete" data-tooltip="Mover a la papelera" aria-label="Mover a la papelera">
          <span class="material-symbols-rounded">delete</span>
        </button>
      </div>
    </div>
  </div>
</div>
