<div class="layout-content" data-ref="shared-view">
  <div class="component-wrapper component-wrapper--full view-wrapper" data-ref="shared-wrapper">
    <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="shared-scrollable">
      <div class="view-header" data-ref="home-floating-top">
        <div class="view-header__left" data-ref="shared-floating-left">
          <h1 class="view-header__title" data-ref="shared-title" data-i18n="shared.title">Compartidos conmigo</h1>
        </div>

        <div class="view-header__right" data-ref="shared-floating-right">
          <div class="view-header__actions" data-ref="shared-default-actions">
            <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-toggle-search" data-tooltip="Buscar en compartidos" aria-label="Buscar en compartidos">
              <span class="material-symbols-rounded">search</span>
            </button>
          </div>
        </div>

        <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
          <div class="component-search component-search--full" data-ref="search-box">
            <div class="component-search__icon" data-ref="search-icon">
              <span class="material-symbols-rounded">search</span>
            </div>
            <div class="component-search__input-box" data-ref="search-input-box">
              <input class="component-search__input" data-ref="shared-search-input" data-i18n-placeholder="shared.search_placeholder" type="text" maxlength="100" autocomplete="off" />
            </div>
            <button type="button" class="component-button component-button--h34 component-button--icon-only" data-ref="btn-clear-search" style="display: none; margin-right: 4px;" aria-label="Limpiar búsqueda">
              <span class="material-symbols-rounded" style="font-size: 18px;">close</span>
            </button>
          </div>
        </div>
      </div>

      <div class="canvas-section" data-ref="canvas-section">
        <div class="canvas-grid" data-ref="shared-grid"></div>
      </div>
    </div>
  </div>
</div>
