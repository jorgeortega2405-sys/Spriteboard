<div class="layout-content" data-ref="shared-view">
  <div class="component-wrapper component-wrapper--full" data-ref="shared-wrapper">
    <!-- Component Top -->
    <div class="component-top" data-ref="component-top">
      <div class="component-top-left" data-ref="component-top-left">
        <h1 class="component-top-title" data-ref="shared-title" data-i18n="shared.title">Compartidos conmigo</h1>
      </div>

      <div class="component-top-right" data-ref="component-top-right">
        <div class="component-top-actions" data-ref="shared-default-actions">
          <button type="button" class="btn btn--h40 btn--icon" data-ref="btn-toggle-search" data-tooltip="Buscar en compartidos" aria-label="Buscar en compartidos">
            <span class="material-symbols-rounded">search</span>
          </button>
        </div>
      </div>

      <!-- Toolbar de búsqueda flotante -->
      <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
        <div class="component-search component-search--full" data-ref="search-box">
          <div class="component-search__icon" data-ref="search-icon">
            <span class="material-symbols-rounded">search</span>
          </div>
          <div class="component-search__input-box" data-ref="search-input-box">
            <input class="component-search__input" data-ref="shared-search-input" data-i18n-placeholder="shared.search_placeholder" type="text" maxlength="100" autocomplete="off" />
          </div>
          <button type="button" class="btn btn--h34 btn--icon btn--clear-search" data-ref="btn-clear-search" style="display: none; margin-right: 4px;" aria-label="Limpiar búsqueda">
            <span class="material-symbols-rounded" style="font-size: 18px;">close</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Component Bottom -->
    <div class="component-bottom component-bottom--no-padding" data-ref="component-bottom">
      <div class="layout-body layout-body--scrollable layout-scrollable" data-ref="shared-scrollable">
        <div class="canvas-section" data-ref="canvas-section">
          <div class="canvas-grid" data-ref="shared-grid"></div>
        </div>
      </div>
    </div>
  </div>
</div>
