        <span class="material-symbols-rounded" data-ref="trash-icon" style="font-size: 48px; color: var(--text-muted);">delete_outline</span>

        </h2>
        <p class="trash-empty-desc" data-ref="trash-empty-desc" data-i18n="trash.empty_desc" style="font-size: 14px; color: var(--text-secondary); margin: 0;">
