<div class="layout-content" data-ref="mindmap-view">
  <div class="component-wrapper component-wrapper--full no-padding view-wrapper" data-ref="mindmap-wrapper">
    <div class="component-top" data-ref="mindmap-top">
      <div class="component-top-left" data-ref="mindmap-top-left">
        <h1 class="component-top-title" data-ref="mindmap-title">Mapa Mental sin título</h1>
      </div>

      <div class="component-top-right" data-ref="mindmap-top-right">
        <div class="design-share-wrapper" data-ref="mindmap-share-wrapper">
          <button type="button" class="component-button component-button--h40 component-button--black design-share-btn" data-ref="btn-share-mindmap" data-tooltip="Compartir mapa mental" aria-label="Compartir mapa mental">
            <span class="component-icon">share</span>
            <span class="design-share-btn__text">Compartir</span>
          </button>
        </div>
      </div>
    </div>

    <div class="component-bottom component-bottom--canvas" data-ref="mindmap-viewport">
      <div class="design-top-toolbar-container" data-ref="mindmap-top-toolbar-container">
        <div class="design-top-toolbar" data-ref="mindmap-top-toolbar">
          <div class="design-top-toolbar__section" data-ref="mindmap-top-toolbar-left">
            <div class="design-toolbar-group" data-ref="mindmap-group-history">
              <button type="button" class="design-toolbar-btn is-disabled" data-ref="btn-undo" data-tooltip="Deshacer (Ctrl+Z)" aria-label="Deshacer" disabled>
                <span class="component-icon">undo</span>
              </button>
              <button type="button" class="design-toolbar-btn is-disabled" data-ref="btn-redo" data-tooltip="Rehacer (Ctrl+Y)" aria-label="Rehacer" disabled>
                <span class="component-icon">redo</span>
              </button>
            </div>

            <div class="design-toolbar-divider" data-ref="mindmap-divider-actions"></div>

            <div class="design-toolbar-group" data-ref="mindmap-group-node-actions">
              <button type="button" class="design-toolbar-btn" data-ref="btn-add-child" data-tooltip="Agregar sub-idea / hijo (Tab)" aria-label="Agregar hijo">
                <span class="component-icon">subdirectory_arrow_right</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="btn-add-sibling" data-tooltip="Agregar idea hermana (Enter)" aria-label="Agregar hermano">
                <span class="component-icon">add_circle_outline</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="btn-add-free-node" data-tooltip="Agregar cuadro / idea libre" aria-label="Agregar cuadro libre">
                <span class="component-icon">crop_square</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="btn-tool-connect" data-tooltip="Conector libre entre ideas (C)" aria-label="Conector">
                <span class="component-icon">arrow_right_alt</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="btn-ai-expand" data-tooltip="Generar o desglosar con IA (Gemini)" aria-label="Generador IA" style="color: #6366f1;">
                <span class="component-icon">auto_awesome</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="btn-toggle-task" data-tooltip="Convertir en tarea / checklist" aria-label="Tarea">
                <span class="component-icon">check_box</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="btn-tidy-up" data-tooltip="Auto-organizar y equilibrar esquema" aria-label="Auto-organizar">
                <span class="component-icon">auto_fix_high</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="btn-edit-node" data-tooltip="Editar texto (F2 o Doble Clic)" aria-label="Editar texto">
                <span class="component-icon">edit</span>
              </button>
              <button type="button" class="design-toolbar-btn" data-ref="btn-delete-node" data-tooltip="Eliminar seleccionado (Supr)" aria-label="Eliminar seleccionado">
                <span class="component-icon">delete_outline</span>
              </button>
            </div>

            <div class="design-toolbar-group" data-ref="mindmap-contextual-actions"></div>

            <div class="design-toolbar-divider" data-ref="mindmap-divider-style"></div>

            <div class="design-toolbar-group" data-ref="mindmap-group-style">
              <button type="button" class="design-toolbar-btn" data-ref="btn-toggle-colors" data-tooltip="Color de la idea / conector" aria-label="Color">
                <span class="design-color-picker__preview" data-ref="mindmap-active-color-swatch" style="background-color: #6366f1;"></span>
              </button>

              <div class="settings-dropdown-wrapper" data-ref="dropdown-wrapper-shapes">
                <button type="button" class="design-toolbar-btn" data-ref="btn-toggle-shapes" data-tooltip="Forma del cuadro" aria-label="Forma">
                  <span class="component-icon" data-ref="icon-current-shape">crop_7_5</span>
                </button>
                <div class="dropdown-backdrop" data-ref="backdrop-shapes">
                  <div class="menu-panel menu-panel--dropdown menu-panel--w-200 menu-panel--h-auto" data-ref="menu-shapes">
                    <div class="menu-panel__list" data-ref="list-shapes">
                      <button type="button" class="menu-item is-active" data-ref="opt-shape-pill" data-shape="pill">
                        <span class="component-icon menu-item__icon">stadium</span>
                        <span class="menu-item__text">Inicio / Fin (Cápsula)</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="opt-shape-rounded" data-shape="rounded">
                        <span class="component-icon menu-item__icon">rounded_corner</span>
                        <span class="menu-item__text">Proceso redondeado</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="opt-shape-rect" data-shape="rect">
                        <span class="component-icon menu-item__icon">crop_square</span>
                        <span class="menu-item__text">Proceso rectangular</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="opt-shape-diamond" data-shape="diamond">
                        <span class="component-icon menu-item__icon">diamond</span>
                        <span class="menu-item__text">Decisión (Rombo)</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="opt-shape-parallelogram" data-shape="parallelogram">
                        <span class="component-icon menu-item__icon">aspect_ratio</span>
                        <span class="menu-item__text">Entrada/Salida (Datos)</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="opt-shape-document" data-shape="document">
                        <span class="component-icon menu-item__icon">description</span>
                        <span class="menu-item__text">Documento</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="opt-shape-sticky" data-shape="sticky">
                        <span class="component-icon menu-item__icon">sticky_note_2</span>
                        <span class="menu-item__text">Nota adhesiva</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="opt-shape-underline" data-shape="underline">
                        <span class="component-icon menu-item__icon">horizontal_rule</span>
                        <span class="menu-item__text">Línea subrayada</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="settings-dropdown-wrapper" data-ref="dropdown-wrapper-emojis">
                <button type="button" class="design-toolbar-btn" data-ref="btn-toggle-emojis" data-tooltip="Agregar icono / emoji" aria-label="Icono">
                  <span class="component-icon">mood</span>
                </button>
                <div class="dropdown-backdrop" data-ref="backdrop-emojis">
                  <div class="menu-panel menu-panel--dropdown menu-panel--w-220 menu-panel--h-auto" data-ref="menu-emojis">
                    <div class="menu-panel__list" data-ref="list-emojis" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 10px;">
                      <button type="button" class="template-variant-pill" data-emoji="💡" style="padding: 6px; font-size: 16px;">💡</button>
                      <button type="button" class="template-variant-pill" data-emoji="🚀" style="padding: 6px; font-size: 16px;">🚀</button>
                      <button type="button" class="template-variant-pill" data-emoji="⚠️" style="padding: 6px; font-size: 16px;">⚠️</button>
                      <button type="button" class="template-variant-pill" data-emoji="✅" style="padding: 6px; font-size: 16px;">✅</button>
                      <button type="button" class="template-variant-pill" data-emoji="🧠" style="padding: 6px; font-size: 16px;">🧠</button>
                      <button type="button" class="template-variant-pill" data-emoji="🎯" style="padding: 6px; font-size: 16px;">🎯</button>
                      <button type="button" class="template-variant-pill" data-emoji="⭐" style="padding: 6px; font-size: 16px;">⭐</button>
                      <button type="button" class="template-variant-pill" data-emoji="📌" style="padding: 6px; font-size: 16px;">📌</button>
                      <button type="button" class="template-variant-pill" data-emoji="❓" style="padding: 6px; font-size: 16px;">❓</button>
                      <button type="button" class="template-variant-pill" data-emoji="none" style="padding: 6px; font-size: 11px;">Quitar</button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="settings-dropdown-wrapper" data-ref="dropdown-wrapper-lines">
                <button type="button" class="design-toolbar-btn" data-ref="btn-toggle-lines" data-tooltip="Estilo y orientación del esquema" aria-label="Estilo y orientación">
                  <span class="component-icon" data-ref="icon-current-line-style">gesture</span>
                </button>
                <div class="dropdown-backdrop" data-ref="backdrop-lines">
                  <div class="menu-panel menu-panel--dropdown menu-panel--w-220 menu-panel--h-auto" data-ref="menu-lines">
                    <div class="menu-panel__list" data-ref="list-line-styles">
                      <button type="button" class="menu-item" data-ref="opt-layout-topdown" data-layout="top-down">
                        <span class="component-icon menu-item__icon">vertical_align_bottom</span>
                        <span class="menu-item__text">Vertical (Conceptual)</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="opt-layout-radial" data-layout="radial">
                        <span class="component-icon menu-item__icon">hub</span>
                        <span class="menu-item__text">Radial (Mental)</span>
                      </button>
                      <div class="design-toolbar-divider" style="margin: 4px 0;"></div>
                      <button type="button" class="menu-item is-active" data-ref="opt-line-curved" data-style="curved">
                        <span class="component-icon menu-item__icon">gesture</span>
                        <span class="menu-item__text">Líneas curvas</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="opt-line-orthogonal" data-style="orthogonal">
                        <span class="component-icon menu-item__icon">alt_route</span>
                        <span class="menu-item__text">Líneas ortogonales</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="opt-line-straight" data-style="straight">
                        <span class="component-icon menu-item__icon">horizontal_rule</span>
                        <span class="menu-item__text">Líneas rectas</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <button type="button" class="design-toolbar-btn" data-ref="btn-realign-tree" data-tooltip="Reordenar y auto-alinear árbol" aria-label="Auto-alinear">
                <span class="component-icon">account_tree</span>
              </button>
            </div>

            <div class="design-toolbar-divider" data-ref="mindmap-divider-export"></div>

            <div class="design-toolbar-group" data-ref="mindmap-group-export">
              <div class="settings-dropdown-wrapper" data-ref="dropdown-wrapper-export">
                <button type="button" class="design-toolbar-btn" data-ref="btn-toggle-export" data-tooltip="Descargar o Exportar" aria-label="Descargar o Exportar">
                  <span class="component-icon">download</span>
                </button>
                <div class="dropdown-backdrop" data-ref="backdrop-export">
                  <div class="menu-panel menu-panel--dropdown menu-panel--w-240 menu-panel--h-auto" data-ref="menu-export">
                    <div class="menu-panel__drag-zone" data-ref="export-drag-zone" aria-hidden="true">
                      <div class="menu-panel__drag-handle"></div>
                    </div>
                    <div class="menu-panel__list" data-ref="list-export-options">
                      <button type="button" class="menu-item" data-ref="btn-export-png">
                        <span class="component-icon menu-item__icon">image</span>
                        <span class="menu-item__text">Imagen PNG (HD)</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="btn-export-svg">
                        <span class="component-icon menu-item__icon">code</span>
                        <span class="menu-item__text">Vectorial SVG</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="btn-export-markdown">
                        <span class="component-icon menu-item__icon">article</span>
                        <span class="menu-item__text">Esquema Markdown (.md)</span>
                      </button>
                      <button type="button" class="menu-item" data-ref="btn-export-json">
                        <span class="component-icon menu-item__icon">data_object</span>
                        <span class="menu-item__text">Archivo JSON del proyecto</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <button type="button" class="design-toolbar-btn" data-ref="btn-center-camera" data-tooltip="Centrar vista (Shift + 1)" aria-label="Centrar vista">
                <span class="component-icon">center_focus_strong</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <canvas class="design-viewport-canvas" data-ref="mindmap-viewport-canvas"></canvas>

      <div class="board-text-editor-container" data-ref="mindmap-text-editor-container"></div>

      <div class="menu-panel menu-panel--dropdown is-hidden" data-ref="mindmap-quick-inserter" style="position: absolute; z-index: 90; min-width: 220px; box-shadow: 0 12px 28px -4px rgba(0,0,0,0.18); border-radius: 10px;">
        <div class="menu-panel__list" data-ref="list-quick-inserter">
          <button type="button" class="menu-item" data-ref="btn-quick-add-child" data-action="add-child">
            <span class="component-icon menu-item__icon">subdirectory_arrow_right</span>
            <span class="menu-item__text">Agregar rama hija (Tab)</span>
          </button>
          <button type="button" class="menu-item" data-ref="btn-quick-add-sibling" data-action="add-sibling">
            <span class="component-icon menu-item__icon">add_circle_outline</span>
            <span class="menu-item__text">Agregar idea hermana (Enter)</span>
          </button>
          <button type="button" class="menu-item" data-ref="btn-quick-add-free" data-action="add-free">
            <span class="component-icon menu-item__icon">crop_square</span>
            <span class="menu-item__text">Insertar cuadro libre</span>
          </button>
          <button type="button" class="menu-item" data-ref="btn-quick-add-ai" data-action="add-ai" style="color: #6366f1;">
            <span class="component-icon menu-item__icon">auto_awesome</span>
            <span class="menu-item__text">Generar con IA (Gemini)</span>
          </button>
          <button type="button" class="menu-item" data-ref="btn-quick-tidy" data-action="tidy-up">
            <span class="component-icon menu-item__icon">auto_fix_high</span>
            <span class="menu-item__text">Auto-organizar esquema</span>
          </button>
        </div>
      </div>

      <div class="design-colors-panel is-hidden" data-ref="mindmap-colors-panel">
        <div class="design-colors-panel__header" data-ref="mindmap-colors-header">
          <div class="design-colors-panel__title-box">
            <span class="component-icon">palette</span>
            <span class="design-colors-panel__title" data-ref="mindmap-colors-title">Color de la idea</span>
          </div>
          <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-close-mindmap-colors" data-tooltip="Cerrar" aria-label="Cerrar">
            <span class="component-icon">close</span>
          </button>
        </div>
        <div class="design-colors-panel__body" data-ref="mindmap-colors-body">
          <div class="design-colors-section" data-ref="mindmap-swatches-section">
            <div class="design-colors-section__header">
              <div class="design-colors-section__title-box">
                <span class="component-icon">color_lens</span>
                <span class="design-colors-section__title">Paleta de colores</span>
              </div>
            </div>
            <div class="design-colors-palette-grid" data-ref="mindmap-colors-grid"></div>
          </div>

          <div class="design-colors-section" data-ref="mindmap-custom-color-section">
            <div class="design-colors-section__header">
              <div class="design-colors-section__title-box">
                <span class="component-icon">colorize</span>
                <span class="design-colors-section__title">Personalizado</span>
              </div>
              <span class="design-colors-hex" data-ref="mindmap-custom-hex-text">#6366F1</span>
            </div>
            <div class="design-colors-custom-row">
              <input class="design-color-active-input" data-ref="input-node-color" type="color" value="#6366f1" aria-label="Color personalizado" />
              <input class="design-colors-text-input" data-ref="input-node-hex" type="text" value="#6366F1" maxlength="7" placeholder="#6366F1" aria-label="Hexadecimal" />
            </div>
          </div>
        </div>
      </div>

      <div class="design-bottom-toolbar-container" data-ref="mindmap-bottom-toolbar-container">
        <div class="design-bottom-toolbar-wrapper" data-ref="mindmap-bottom-toolbar-wrapper">
          <div class="design-bottom-toolbar" data-ref="mindmap-bottom-toolbar">
            <div class="design-bottom-toolbar__section" data-ref="mindmap-shortcuts-hint-section" style="padding: 0 12px; font-size: 12px; color: var(--color-text-muted, #64748b); display: flex; align-items: center; gap: 8px;">
              <span><kbd style="padding: 2px 6px; background: rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.1); border-radius: 4px;">Tab</kbd> Sub-idea</span>
              <span>•</span>
              <span><kbd style="padding: 2px 6px; background: rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.1); border-radius: 4px;">Enter</kbd> Hermano</span>
              <span>•</span>
              <span>Arrastrar selección</span>
            </div>

            <div class="design-bottom-toolbar__section design-bottom-toolbar__section--zoom" data-ref="mindmap-zoom-section">
              <div class="design-toolbar-group" data-ref="mindmap-group-zoom">
                <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-toggle-minimap" data-tooltip="Alternar minimapa" aria-label="Minimapa">
                  <span class="component-icon">map</span>
                </button>
                <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-zoom-out" data-tooltip="Alejar (Ctrl -)" aria-label="Alejar">
                  <span class="component-icon">remove</span>
                </button>
                <button type="button" class="design-toolbar-badge design-toolbar-badge--clickable" data-ref="btn-zoom-reset" data-tooltip="Restablecer zoom (100%)" aria-label="Restablecer zoom">
                  <span class="design-toolbar-badge__text" data-ref="mindmap-zoom-value">100%</span>
                </button>
                <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-zoom-in" data-tooltip="Acercar (Ctrl +)" aria-label="Acercar">
                  <span class="component-icon">add</span>
                </button>
                <button type="button" class="design-toolbar-btn design-toolbar-btn--sm" data-ref="btn-zoom-fit" data-tooltip="Ajustar a contenido" aria-label="Ajustar a contenido">
                  <span class="component-icon">fit_screen</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
