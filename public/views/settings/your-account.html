<div class="layout-content" data-ref="settings-your-account-view">
  <div class="layout-body layout-body--scrollable layout-scrollable" data-ref="settings-scrollable">
    <div class="settings-layout" data-ref="settings-layout">
      <div class="settings-header" data-ref="settings-header">
        <h1 class="settings-title" data-ref="settings-title" data-i18n="settings.your_account.title"></h1>
        <p class="settings-subtitle" data-ref="settings-subtitle" data-i18n="settings.your_account.subtitle"></p>
      </div>

      <!-- Grupo 1: Perfil y Datos Personales -->
      <div class="settings-group" data-ref="group-profile-data">
        <!-- Item 1: Foto de perfil -->
        <div class="settings-item" data-ref="item-avatar">
          <div class="settings-item__content" data-ref="item-avatar-content">
            <div class="settings-item__avatar" data-ref="avatar-preview-box" data-i18n-tooltip="settings.your_account.avatar_change_tooltip">
              <img class="avatar-preview-img" data-ref="profile-avatar-img" src="" alt="Avatar" referrerpolicy="no-referrer" />
              <div class="avatar-preview-overlay" data-ref="avatar-preview-overlay">
                <span class="material-symbols-rounded">photo_camera</span>
              </div>
            </div>
            <div class="settings-item__text" data-ref="item-avatar-text">
              <h2 class="settings-item__title" data-ref="item-avatar-title" data-i18n="settings.your_account.avatar_title"></h2>
              <p class="settings-item__desc" data-ref="item-avatar-desc" data-i18n="settings.your_account.avatar_desc"></p>
              <input class="settings-file-input" data-ref="input-avatar-file" type="file" accept="image/png, image/jpeg, image/jpg, image/webp" style="display: none;" />
            </div>
          </div>
          <div class="settings-item__actions" data-ref="item-avatar-actions">
            <button type="button" class="btn btn--h34 btn--black" data-ref="btn-upload-avatar" data-i18n="settings.your_account.btn_upload_photo"></button>
            <button type="button" class="btn btn--h34 btn--black" data-ref="btn-change-avatar" data-i18n="settings.your_account.btn_change_photo" style="display: none;"></button>
            <button type="button" class="btn btn--h34" data-ref="btn-delete-avatar" data-i18n="settings.your_account.btn_delete_photo" style="display: none;"></button>
            <button type="button" class="btn btn--h34" data-ref="btn-cancel-avatar" data-i18n="settings.your_account.btn_cancel" style="display: none;"></button>
            <button type="button" class="btn btn--h34 btn--black" data-ref="btn-save-avatar" data-i18n="settings.your_account.btn_save" style="display: none;"></button>
          </div>
        </div>
        <div class="banner banner--danger" data-ref="avatar-error" style="display: none; margin: 0 24px 16px 24px;"></div>

        <hr class="settings-divider" />

        <!-- Item 2: Nombre de usuario -->
        <div class="settings-item" data-ref="item-username">
          <div class="settings-item__content" data-ref="item-username-content">
            <div class="settings-item__text" data-ref="item-username-text">
              <h2 class="settings-item__title" data-ref="item-username-title" data-i18n="settings.your_account.username_title"></h2>
              <div class="settings-item__view-box" data-ref="username-view-box">
                <span class="settings-item__value" data-ref="display-username">-</span>
              </div>
              <div class="settings-edit-row" data-ref="username-edit-row" style="display: none;">
                <input class="field__input field__input--simple" data-ref="input-username" data-i18n-placeholder="settings.your_account.username_placeholder" type="text" autocomplete="username" />
                <div class="settings-item__actions">
                  <button type="button" class="btn btn--h34" data-ref="btn-cancel-username" data-i18n="settings.your_account.btn_cancel"></button>
                  <button type="button" class="btn btn--h34 btn--black" data-ref="btn-save-username" data-i18n="settings.your_account.btn_save"></button>
                </div>
              </div>
            </div>
          </div>
          <div class="settings-item__actions" data-ref="username-view-actions">
            <button type="button" class="btn btn--h34" data-ref="btn-edit-username" data-i18n="settings.your_account.btn_edit"></button>
          </div>
        </div>
        <div class="banner banner--danger" data-ref="username-error" style="display: none; margin: 0 24px 16px 24px;"></div>

        <hr class="settings-divider" />

        <!-- Item 3: Correo electrónico -->
        <div class="settings-item" data-ref="item-email">
          <div class="settings-item__content" data-ref="item-email-content">
            <div class="settings-item__text" data-ref="item-email-text">
              <h2 class="settings-item__title" data-ref="item-email-title" data-i18n="settings.your_account.email_title"></h2>
              <div class="settings-item__view-box" data-ref="email-view-box">
                <span class="settings-item__value" data-ref="display-email">-</span>
              </div>
              <div class="settings-edit-row" data-ref="email-edit-row" style="display: none;">
                <input class="field__input field__input--simple" data-ref="input-email" data-i18n-placeholder="settings.your_account.email_placeholder" type="email" autocomplete="email" />
                <div class="settings-item__actions">
                  <button type="button" class="btn btn--h34" data-ref="btn-cancel-email" data-i18n="settings.your_account.btn_cancel"></button>
                  <button type="button" class="btn btn--h34 btn--black" data-ref="btn-save-email" data-i18n="settings.your_account.btn_save"></button>
                </div>
              </div>
            </div>
          </div>
          <div class="settings-item__actions" data-ref="email-view-actions">
            <button type="button" class="btn btn--h34" data-ref="btn-edit-email" data-i18n="settings.your_account.btn_edit"></button>
          </div>
        </div>
        <div class="banner banner--danger" data-ref="email-error" style="display: none; margin: 0 24px 16px 24px;"></div>
      </div>

      <!-- Grupo 2: Cuentas vinculadas -->
      <div class="settings-group" data-ref="group-connected-accounts">
        <!-- Item: Google -->
        <div class="settings-item" data-ref="item-google">
          <div class="settings-item__content" data-ref="item-google-content">
            <div class="settings-item__icon-box" data-ref="item-google-icon-box">
              <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.15C3.26 21.3 7.31 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.99-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.61l3.99 3.15c.95-2.85 3.6-4.96 6.72-4.96z"/>
              </svg>
            </div>
            <div class="settings-item__text" data-ref="item-google-text">
              <h2 class="settings-item__title" data-ref="item-google-title" data-i18n="settings.your_account.google_title"></h2>
              <p class="settings-item__desc" data-ref="google-account-status"></p>
            </div>
          </div>
          <div class="settings-item__actions" data-ref="item-google-actions">
            <button type="button" class="btn btn--h34" data-ref="btn-google-account-action" data-i18n="settings.your_account.btn_connect"></button>
          </div>
        </div>
      </div>

      <!-- Grupo 3: Idioma de la plataforma -->
      <div class="settings-group" data-ref="group-language">
        <!-- Item: Idioma -->
        <div class="settings-item settings-item--stacked" data-ref="item-language">
          <div class="settings-item__content" data-ref="item-language-content">
            <div class="settings-item__text" data-ref="item-language-text">
              <h2 class="settings-item__title" data-ref="item-language-title" data-i18n="settings.your_account.language_title"></h2>
              <p class="settings-item__desc" data-ref="item-language-desc" data-i18n="settings.your_account.language_desc"></p>
            </div>
          </div>
          <div class="settings-dropdown-wrapper" data-ref="dropdown-wrapper-language">
            <button type="button" class="dropdown-trigger" data-ref="btn-trigger-language" data-i18n-aria="settings.your_account.language_trigger_aria">
              <div class="dropdown-trigger__left">
                <span class="material-symbols-rounded dropdown-trigger__icon">language</span>
                <span class="dropdown-trigger__text" data-ref="language-selected-text"></span>
              </div>
              <span class="material-symbols-rounded dropdown-trigger__chevron">expand_more</span>
            </button>

            <div class="dropdown-backdrop" data-ref="dropdown-backdrop-language">
              <div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" data-ref="dropdown-menu-language">
                <div class="menu-panel__drag-zone" data-ref="drag-zone-language">
                  <div class="menu-panel__drag-handle"></div>
                </div>
                <div class="menu-panel__search" data-ref="search-wrapper-language">
                  <span class="material-symbols-rounded menu-panel__search-icon">search</span>
                  <input class="menu-panel__search-input" data-ref="input-search-language" data-i18n-placeholder="settings.your_account.search_language_placeholder" type="text" autocomplete="off" />
                </div>
                <div class="menu-panel__list menu-panel__list--scrollable" data-ref="list-languages">
                  <!-- Opciones de idiomas renderizadas dinámicamente -->
                </div>
                <div class="menu-panel__empty" data-ref="empty-languages" data-i18n="settings.your_account.no_languages_found" style="display: none;">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Grupo 4: Preferencias de navegación -->
      <div class="settings-group" data-ref="group-navigation-preferences">
        <!-- Item 1: Enlaces en nueva pestaña -->
        <div class="settings-item" data-ref="item-open-links">
          <div class="settings-item__content" data-ref="item-open-links-content">
            <div class="settings-item__text" data-ref="item-open-links-text">
              <h2 class="settings-item__title" data-ref="item-open-links-title" data-i18n="settings.your_account.links_new_tab_title"></h2>
              <p class="settings-item__desc" data-ref="item-open-links-desc" data-i18n="settings.your_account.links_new_tab_desc"></p>
            </div>
          </div>
          <div class="settings-item__actions" data-ref="item-open-links-actions">
            <label class="toggle-switch" data-ref="label-toggle-open-links">
              <input class="toggle-switch__input" data-ref="toggle-open-links" type="checkbox" checked />
              <span class="toggle-switch__slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
