<div class="layout-content" data-ref="error-view">
  <div class="login-container" data-ref="error-wrapper">
    <a class="login-header-logo" data-ref="error-home-link" href="/" aria-label="Ir al inicio" title="Spriteboard">
      <img class="login-logo-img" data-ref="logo-img" src="/logo.svg" alt="Spriteboard" />
    </a>

    <div class="card card--w-400" data-ref="error-card" style="text-align: center; align-items: center;">
      <div class="error-icon-box" data-ref="error-icon-box" style="margin-bottom: 8px;">
        <span class="material-symbols-rounded" data-ref="error-icon" style="font-size: 56px; color: #ef4444;">error_outline</span>
      </div>

      <div class="card__header" data-ref="error-header" style="text-align: center;">
        <span class="badge badge--danger" data-ref="error-badge">404</span>
        <h1 class="card__title" data-ref="error-title">Página no encontrada</h1>
        <p class="card__subtitle" data-ref="error-desc">La página que estás intentando abrir no existe o ha sido movida.</p>
      </div>

      <div class="card__body" data-ref="error-body" style="width: 100%; margin-top: 12px;">
        <button type="button" class="btn btn--h55 btn--black btn--w-full" data-ref="error-action-btn">
          Ir a la página principal
        </button>
      </div>
    </div>
  </div>
</div>
