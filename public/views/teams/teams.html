<div class="layout-content" data-ref="teams-view">
  <div class="component-wrapper component-wrapper--full" data-ref="teams-wrapper">
    <!-- Component Top -->
    <div class="component-top" data-ref="component-top">
      <div class="component-top-left" data-ref="component-top-left">
        <h1 class="component-top-title" data-ref="teams-title" data-i18n="teams.title">Tus equipos</h1>
      </div>

      <div class="component-top-right" data-ref="component-top-right">
        <!-- Acciones por defecto -->
        <div class="component-top-actions" data-ref="teams-default-actions">
          <button type="button" class="btn btn--h40 btn--icon" data-ref="btn-toggle-search" data-tooltip="Buscar equipos" aria-label="Buscar equipos">
            <span class="material-symbols-rounded">search</span>
          </button>
          <button type="button" class="btn btn--h40 btn--icon" data-ref="btn-create-team" data-tooltip="Crear equipo" aria-label="Crear equipo">
            <span class="material-symbols-rounded">group_add</span>
          </button>
        </div>

        <!-- Acciones contextuales al seleccionar items -->
        <div class="component-top-actions" data-ref="teams-selected-actions" style="display: none;">
          <button type="button" class="btn btn--h40 btn--icon" data-ref="btn-action-members" data-tooltip="Miembros" aria-label="Miembros">
            <span class="material-symbols-rounded">groups</span>
          </button>
          <button type="button" class="btn btn--h40 btn--icon" data-ref="btn-action-edit" data-tooltip="Editar" aria-label="Editar">
            <span class="material-symbols-rounded">edit</span>
          </button>
          <button type="button" class="btn btn--h40 btn--danger btn--icon" data-ref="btn-action-delete" data-tooltip="Eliminar" aria-label="Eliminar">
            <span class="material-symbols-rounded">delete</span>
          </button>
        </div>
      </div>

      <!-- Toolbar de búsqueda flotante -->
      <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
        <div class="component-search component-search--full" data-ref="search-box">
          <div class="component-search__icon" data-ref="search-icon">
            <span class="material-symbols-rounded">search</span>
          </div>
          <div class="component-search__input-box" data-ref="search-input-box">
            <input class="component-search__input" data-ref="teams-search-input" data-i18n-placeholder="teams.search_placeholder" type="text" maxlength="100" autocomplete="off" />
          </div>
          <button type="button" class="btn btn--h34 btn--icon btn--clear-search" data-ref="btn-clear-search" style="display: none; margin-right: 4px;" aria-label="Limpiar búsqueda">
            <span class="material-symbols-rounded" style="font-size: 18px;">close</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Component Bottom -->
    <div class="component-bottom component-bottom--no-padding" data-ref="component-bottom">
      <div class="component-table-wrapper" data-ref="teams-table-wrapper">
        <table class="component-table" data-ref="teams-table">
          <thead class="component-table__head" data-ref="teams-thead">
            <tr>
              <th data-ref="th-team" data-i18n="teams.col_team">Equipo</th>
              <th data-ref="th-desc" data-i18n="teams.col_desc">Descripción</th>
              <th data-ref="th-members" data-i18n="teams.col_members">Miembros</th>
              <th data-ref="th-role" data-i18n="teams.col_role">Rol</th>
              <th data-ref="th-created" data-i18n="teams.col_created">Fecha de creación</th>
            </tr>
          </thead>
          <tbody class="component-table__body" data-ref="teams-tbody">
            <!-- Filas inyectadas dinámicamente -->
          </tbody>
        </table>

        <!-- Estado vacío -->
        <div class="component-empty-state component-empty-state--table" data-ref="teams-empty-state" style="display: none;">
          <div class="component-empty-state-graphic" data-ref="empty-graphic">
            <svg class="component-empty-state-svg" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="userGradMain" x1="35" y1="35" x2="105" y2="105" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#52525b"></stop>
                  <stop offset="50%" stop-color="#3f3f46"></stop>
                  <stop offset="100%" stop-color="#27272a"></stop>
                </linearGradient>
                <linearGradient id="userGradBack" x1="30" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#3f3f46"></stop>
                  <stop offset="100%" stop-color="#18181b"></stop>
                </linearGradient>
              </defs>
              <g opacity="0.6">
                <circle cx="48" cy="46" r="14" fill="url(#userGradBack)" stroke="#52525b" stroke-width="1.5"></circle>
                <path d="M28 84 C28 70 38 68 48 68 C58 68 68 70 68 84 Z" fill="url(#userGradBack)" stroke="#52525b" stroke-width="1.5"></path>
              </g>
              <g opacity="0.6">
                <circle cx="92" cy="46" r="14" fill="url(#userGradBack)" stroke="#52525b" stroke-width="1.5"></circle>
                <path d="M72 84 C72 70 82 68 92 68 C102 68 112 70 112 84 Z" fill="url(#userGradBack)" stroke="#52525b" stroke-width="1.5"></path>
              </g>
              <circle cx="70" cy="50" r="18" fill="url(#userGradMain)" stroke="#71717a" stroke-width="2"></circle>
              <circle cx="70" cy="46" r="6" fill="#e4e4e7" opacity="0.8"></circle>
              <path d="M44 98 C44 80 56 76 70 76 C84 76 96 80 96 98 Z" fill="url(#userGradMain)" stroke="#71717a" stroke-width="2"></path>
              <rect x="62" y="82" width="16" height="4" rx="2" fill="#e4e4e7" opacity="0.5"></rect>
              <g>
                <path d="M116 28 L117.5 32.5 L122 34 L117.5 35.5 L116 40 L114.5 35.5 L110 34 L114.5 32.5 Z" fill="#e4e4e7"></path>
                <path d="M22 46 L23 49 L26 50 L23 51 L22 54 L21 51 L18 50 L21 49 Z" fill="#a1a1aa"></path>
                <path d="M102 96 L103 98 L105 99 L103 100 L102 102 L101 100 L99 99 L101 98 Z" fill="#71717a"></path>
              </g>
            </svg>
          </div>
          <h2 class="component-empty-state-title" data-ref="teams-empty-title" data-i18n="teams.empty_title"></h2>
          <p class="component-empty-state-desc" data-ref="teams-empty-text" data-i18n="teams.empty_desc"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" data-ref="modal-team-backdrop">
    <div class="modal-container" data-ref="modal-team-container">
      <button type="button" class="modal-close-btn" data-ref="btn-close-team-modal" aria-label="Cerrar modal">
        <span class="material-symbols-rounded">close</span>
      </button>
      <div class="modal-card modal-card--w-520" data-ref="modal-team-card">
        <div class="modal-card__header">
          <h2 class="modal-card__title" data-ref="modal-team-title" data-i18n="teams.modal_create_title">Nuevo equipo de trabajo</h2>
        </div>
        <form class="modal-card__body" data-ref="form-team">
          <label class="field" data-ref="field-team-name">
            <input class="field__input" data-ref="input-team-name" type="text" placeholder=" " maxlength="100" autocomplete="off" required />
            <span class="field__label" data-ref="label-team-name" data-i18n="teams.name_label">Nombre del equipo</span>
          </label>
          <label class="field" data-ref="field-team-desc">
            <input class="field__input" data-ref="input-team-desc" type="text" placeholder=" " maxlength="255" autocomplete="off" />
            <span class="field__label" data-ref="label-team-desc" data-i18n="teams.desc_label">Descripción (opcional)</span>
          </label>

          <div class="modal-card__actions">
            <button type="button" class="btn btn--h40 btn--outline" data-ref="btn-cancel-team" data-i18n="modal.cancel">Cancelar</button>
            <button type="submit" class="btn btn--h40 btn--black" data-ref="btn-submit-team" data-i18n="teams.btn_save">Guardar equipo</button>
          </div>
          <div class="banner banner--danger is-hidden" data-ref="banner-team-error"></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" data-ref="modal-members-backdrop">
    <div class="modal-container" data-ref="modal-members-container">
      <button type="button" class="modal-close-btn" data-ref="btn-close-members-modal" aria-label="Cerrar modal">
        <span class="material-symbols-rounded">close</span>
      </button>
      <div class="modal-card modal-card--w-520" data-ref="modal-members-card">
        <div class="modal-card__header">
          <h2 class="modal-card__title" data-ref="members-modal-title" data-i18n="teams.members_title">Integrantes del equipo</h2>
        </div>
        <div class="modal-card__body">
          <div class="field-group">
            <div style="display: flex; gap: 8px; align-items: stretch;">
              <label class="field" data-ref="field-add-member" style="flex: 1; margin: 0;">
                <input class="field__input" data-ref="input-add-member" type="text" placeholder=" " autocomplete="off" />
                <span class="field__label" data-ref="label-add-member" data-i18n="teams.add_member_placeholder">Buscar por nombre o correo...</span>
              </label>
              <button type="button" class="btn btn--h55 btn--black" data-ref="btn-add-member" style="white-space: nowrap; padding: 0 16px;">
                <span class="material-symbols-rounded">person_add</span>
                <span data-i18n="teams.btn_add_member">Agregar</span>
              </button>
            </div>
          </div>

          <div class="field-group">
            <div class="settings-dropdown-wrapper settings-dropdown-wrapper--full" data-ref="members-dropdown-wrapper">
              <button type="button" class="dropdown-trigger dropdown-trigger--full" data-ref="btn-trigger-members">
                <div class="dropdown-trigger__left">
                  <span class="material-symbols-rounded dropdown-trigger__icon">groups</span>
                  <span class="dropdown-trigger__text" data-ref="members-trigger-text">Integrantes</span>
                </div>
                <span class="material-symbols-rounded dropdown-trigger__chevron">expand_more</span>
              </button>

              <div class="dropdown-backdrop" data-ref="members-dropdown-backdrop">
                <div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" data-ref="members-dropdown-menu">
                  <div class="menu-panel__list menu-panel__list--scrollable" data-ref="members-dropdown-list">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="modal-card__actions">
            <button type="button" class="btn btn--h40 btn--black" data-ref="btn-done-members" data-i18n="modal.close">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
