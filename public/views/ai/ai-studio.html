<div class="component-wrapper component-wrapper--full no-padding view-wrapper ai-studio-wrapper" data-ref="ai-studio-container">
  <header class="view-header ai-studio-header" data-ref="ai-studio-header">
    <div class="view-header__left" data-ref="ai-studio-header-left">
      <div class="brand-kit-picker ai-chat-picker" data-ref="dropdown-wrapper-chat-history">
        <button type="button" class="brand-kit-picker__btn ai-chat-picker__btn" data-ref="btn-trigger-chat-history" aria-label="Historial de conversaciones">
          <div class="ai-chat-picker__label">
            <svg class="component-icon ai-chat-picker__icon" aria-hidden="true"><use href="/icons.svg#auto_awesome"></use></svg>
            <span class="ai-chat-picker__text" data-ref="lbl-active-session-title">Conversaciones</span>
          </div>
          <svg class="component-icon ai-chat-picker__chevron" aria-hidden="true"><use href="/icons.svg#expand_more"></use></svg>
        </button>

        <div class="dropdown-backdrop" data-ref="dropdown-backdrop-chat-history">
          <div class="menu-panel menu-panel--dropdown menu-panel--w-285 menu-panel--h-auto" data-ref="dropdown-menu-chat-history">
            <div class="menu-panel__list menu-panel__list--scrollable ai-studio-history-list" data-ref="chat-history-list" style="max-height: 280px;"></div>
            <div class="ai-studio-history-empty" data-ref="chat-history-empty" style="display: none;">
              <p>No tienes chats previos aún.</p>
            </div>
            <div class="menu-divider"></div>
            <button type="button" class="menu-item" data-ref="btn-picker-new-chat">
              <svg class="component-icon menu-item__icon" aria-hidden="true"><use href="/icons.svg#add"></use></svg>
              <span class="menu-item__text">Nueva conversación</span>
            </button>
          </div>
        </div>
      </div>

      <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-new-chat" data-tooltip="Nueva conversación" aria-label="Nueva conversación">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#add"></use></svg>
      </button>
    </div>
  </header>

  <div class="ai-studio-workspace" data-ref="ai-studio-workspace">
    <section class="ai-studio-chat-panel" data-ref="ai-studio-chat-panel">
      <div class="ai-studio-hero" data-ref="ai-studio-hero">
        <h2 class="ai-studio-hero__title" data-ref="ai-studio-hero-title">¿Qué vamos a diseñar hoy, <span data-ref="hero-username"></span>?</h2>
        <p class="ai-studio-hero__subtitle">Describe tu idea y Spritebot diseñará presentaciones, mapas conceptuales, documentos o posts listos para editar.</p>

        <div class="ai-studio-starters" data-ref="ai-studio-starters">
          <button type="button" class="ai-studio-starter-card" data-ref="starter-mindmap" data-prompt="Crea un mapa mental sobre energías renovables y sostenibilidad">
            <span class="ai-studio-starter-card__icon" aria-hidden="true">🧠</span>
            <div class="ai-studio-starter-card__content">
              <h3 class="ai-studio-starter-card__title">Mapa Mental o Conceptual</h3>
              <p class="ai-studio-starter-card__desc">Estructura ramas, ideas y conceptos conectados</p>
            </div>
          </button>

          <button type="button" class="ai-studio-starter-card" data-ref="starter-presentation" data-prompt="Crea una presentación de 5 diapositivas para lanzar una startup de inteligencia artificial">
            <span class="ai-studio-starter-card__icon" aria-hidden="true">📊</span>
            <div class="ai-studio-starter-card__content">
              <h3 class="ai-studio-starter-card__title">Presentación Ejecutiva</h3>
              <p class="ai-studio-starter-card__desc">Diapositivas 16:9 con portada, métricas y contenido</p>
            </div>
          </button>

          <button type="button" class="ai-studio-starter-card" data-ref="starter-doc" data-prompt="Redacta un documento con las políticas de trabajo remoto y mejores prácticas para el equipo">
            <span class="ai-studio-starter-card__icon" aria-hidden="true">📄</span>
            <div class="ai-studio-starter-card__content">
              <h3 class="ai-studio-starter-card__title">Documento o Reporte</h3>
              <p class="ai-studio-starter-card__desc">Artículos, especificaciones y contratos organizados</p>
            </div>
          </button>

          <button type="button" class="ai-studio-starter-card" data-ref="starter-social" data-prompt="Diseña un post para Instagram promocionando una semana de descuentos en cursos digitales">
            <span class="ai-studio-starter-card__icon" aria-hidden="true">📱</span>
            <div class="ai-studio-starter-card__content">
              <h3 class="ai-studio-starter-card__title">Publicación para Redes</h3>
              <p class="ai-studio-starter-card__desc">Copies de impacto, hashtags y estructura visual</p>
            </div>
          </button>
        </div>
      </div>

      <div class="chat-messages ai-studio-messages" data-ref="ai-studio-messages" style="display: none;"></div>

      <div class="chat-panel__bottom ai-studio-chat-bottom" data-ref="chat-panel-bottom">
        <div class="chat-pill-input" data-ref="chat-input-box">
          <textarea class="chat-pill-input__field" data-ref="chat-input" placeholder="Escribe un mensaje..." rows="1" maxlength="2500"></textarea>
          <button type="button" class="component-button component-button--icon-only chat-pill-input__btn" data-ref="btn-chat-send" aria-label="Enviar mensaje" data-tooltip="Enviar mensaje">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#send"></use></svg>
          </button>
        </div>
        <p class="chat-disclaimer" data-ref="chat-disclaimer">Las conversaciones son procesadas por IA y auditadas para garantizar la calidad y seguridad.</p>
      </div>
    </section>

    <aside class="ai-studio-preview-panel" data-ref="ai-studio-preview-panel" style="display: none;">
      <div class="ai-studio-preview-header" data-ref="ai-studio-preview-header">
        <div class="ai-studio-preview-header__info" data-ref="ai-studio-preview-info">
          <span class="ai-studio-preview-header__icon" data-ref="preview-format-icon" aria-hidden="true">✨</span>
          <div class="ai-studio-preview-header__text" data-ref="ai-studio-preview-text">
            <h3 class="ai-studio-preview-header__title" data-ref="preview-title">Vista previa en vivo</h3>
            <span class="ai-studio-preview-header__format" data-ref="preview-format-badge">Lienzo</span>
          </div>
        </div>
        <div class="ai-studio-preview-header__actions" data-ref="ai-studio-preview-actions">
          <button type="button" class="component-button component-button--h36 component-button--black" data-ref="btn-open-in-canvas" aria-label="Abrir en lienzo">
            <span aria-hidden="true">✨</span>
            <span>Abrir en lienzo</span>
          </button>
          <button type="button" class="component-button component-button--h36 component-button--icon-only component-button--ghost" data-ref="btn-close-preview" data-tooltip="Cerrar vista previa" aria-label="Cerrar vista previa">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>
        </div>
      </div>

      <div class="ai-studio-preview-body" data-ref="ai-studio-preview-body"></div>
    </aside>
  </div>
</div>
