<div class="layout-content" data-ref="register-view">
  <div class="login-container" data-ref="register-wrapper">
    <a class="login-header-logo" data-ref="register-home-link" href="/" aria-label="Ir al inicio" title="Spriteboard">
      <img class="login-logo-img" data-ref="logo-img" src="/logo.svg" alt="Spriteboard" />
    </a>

    <div class="card card--w-400" data-ref="register-card">
      <div class="card__header" data-ref="register-header">
        <span class="badge badge--subtle" data-ref="stage-badge">Paso 1 de 3</span>
        <h1 class="card__title" data-ref="register-title">Crear cuenta</h1>
        <p class="card__subtitle" data-ref="register-subtitle">Ingresa tu correo y contraseña para comenzar</p>
      </div>

      <div class="card__body" data-ref="register-form">
        <label class="field" data-ref="field-register-email">
          <input class="field__input" data-ref="register-email" type="email" placeholder=" " autocomplete="email" />
          <span class="field__label" data-ref="label-register-email">Correo electrónico</span>
        </label>

        <label class="field" data-ref="field-register-password">
          <input class="field__input field__input--has-action" data-ref="register-password" type="password" placeholder=" " autocomplete="new-password" />
          <span class="field__label" data-ref="label-register-password">Contraseña (mínimo 8 caracteres)</span>
          <button type="button" class="field__action" data-ref="toggle-register-password" data-tooltip="Mostrar contraseña" aria-label="Alternar visibilidad">
            <span class="material-symbols-rounded">visibility</span>
          </button>
        </label>

        <button type="button" class="btn btn--h55 btn--black btn--w-full" data-ref="btn-submit-stage1">
          Continuar
        </button>

        <button type="button" class="btn btn--h55 btn--w-full" data-ref="btn-google-register">
          <svg class="google-icon" data-ref="google-icon" width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span class="btn-text" data-ref="google-btn-text">Continuar con Google</span>
        </button>

        <div class="banner banner--danger" data-ref="register-error" style="display: none;"></div>

        <p class="footer-note" data-ref="register-footer">
          ¿Ya tienes una cuenta? <a class="link link--primary" data-ref="btn-to-login" href="/login">Iniciar sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
