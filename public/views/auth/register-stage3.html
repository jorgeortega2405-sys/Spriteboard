<div class="layout-content" data-ref="register-stage3-view">
  <div class="login-container" data-ref="stage3-wrapper">
    <a class="login-header-logo" data-ref="stage3-home-link" href="/" aria-label="Ir al inicio" title="Spriteboard">
      <img class="login-logo-img" data-ref="logo-img" src="/logo.svg" alt="Spriteboard" />
    </a>

    <div class="card card--w-400" data-ref="stage3-card">
      <div class="card__header" data-ref="stage3-header">
        <span class="badge badge--subtle" data-ref="stage-badge">Paso 3 de 3</span>
        <h1 class="card__title" data-ref="stage3-title">Revisa tu correo</h1>
        <p class="card__subtitle" data-ref="stage3-subtitle">
          Hemos enviado un código de 6 dígitos a <strong class="text-highlight" data-ref="verify-target-email"></strong>. Es válido durante 15 minutos.
        </p>
      </div>

      <div class="banner banner--danger" data-ref="stage3-error" style="display: none;"></div>
      <div class="banner banner--success" data-ref="stage3-success" style="display: none;"></div>

      <div class="card__body" data-ref="stage3-form">
        <label class="field" data-ref="field-register-code">
          <input class="field__input field__input--code" data-ref="register-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder=" " autocomplete="one-time-code" />
          <span class="field__label" data-ref="label-register-code">Código de 6 dígitos</span>
        </label>

        <button type="button" class="btn btn--h55 btn--black btn--w-full" data-ref="btn-submit-stage3">
          Verificar cuenta
        </button>

        <button type="button" class="btn btn--h40 btn--ghost btn--w-full" data-ref="btn-resend-code">
          ¿No recibiste el código? Reenviar
        </button>

        <div class="link-row" data-ref="stage3-back-row" style="justify-content: center; margin-top: 8px;">
          <a class="link" data-ref="btn-restart-register" href="/register">← Iniciar registro de nuevo</a>
        </div>
      </div>
    </div>
  </div>
</div>
