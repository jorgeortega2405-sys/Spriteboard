<div class="layout-content" data-ref="login-view">
  <div class="login-container" data-ref="login-wrapper">
    <a class="login-header-logo" data-ref="login-home-link" href="/" data-i18n-aria="nav.go_home" data-i18n-title="app.name">
      <img class="login-logo-img" data-ref="logo-img" src="/logo.svg" alt="Spriteboard" />
    </a>

    <div class="card card--w-400" data-ref="login-card">
      <div class="card__header" data-ref="login-header">
        <h1 class="card__title" data-ref="login-title" data-i18n="auth.login.title"></h1>
        <p class="card__subtitle" data-ref="login-subtitle" data-i18n="auth.login.subtitle"></p>
      </div>

      <div class="card__body" data-ref="login-form">
        <label class="field" data-ref="field-login-email">
          <input class="field__input" data-ref="login-email" type="email" placeholder=" " autocomplete="email" />
          <span class="field__label" data-ref="label-login-email" data-i18n="auth.login.email_label"></span>
        </label>

        <label class="field" data-ref="field-login-password">
          <input class="field__input field__input--has-action" data-ref="login-password" type="password" placeholder=" " autocomplete="current-password" />
          <span class="field__label" data-ref="label-login-password" data-i18n="auth.login.password_label"></span>
          <button type="button" class="field__action" data-ref="toggle-login-password" data-i18n-tooltip="auth.login.show_password" data-i18n-aria="auth.login.toggle_password">
            <span class="material-symbols-rounded">visibility</span>
          </button>
        </label>

        <div class="link-row" data-ref="login-forgot-row">
          <a class="link" data-ref="btn-forgot-password" href="/forgot-password" data-i18n="auth.login.forgot_password"></a>
        </div>

        <button type="button" class="btn btn--h55 btn--black btn--w-full" data-ref="btn-submit-login" data-i18n="auth.login.submit_btn">
        </button>

        <button type="button" class="btn btn--h55 btn--w-full" data-ref="btn-google-login">
          <svg class="google-icon" data-ref="google-icon" width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span class="btn-text" data-ref="google-btn-text" data-i18n="auth.login.google_btn"></span>
        </button>

        <div class="banner banner--danger" data-ref="login-error" style="display: none;"></div>

        <p class="footer-note" data-ref="login-footer">
          <span data-i18n="auth.login.no_account"></span> <a class="link link--primary" data-ref="btn-to-register" href="/register" data-i18n="auth.login.create_account"></a>
        </p>
      </div>
    </div>
  </div>
</div>
