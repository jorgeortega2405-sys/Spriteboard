<div class="layout-content" data-ref="forgot-view">
  <div class="login-container" data-ref="forgot-wrapper">
    <a class="login-header-logo" data-ref="forgot-home-link" href="/" aria-label="Ir al inicio" title="Spriteboard">
      <img class="login-logo-img" data-ref="logo-img" src="/logo.svg" alt="Spriteboard" />
    </a>

    <div class="card card--w-400" data-ref="forgot-card">
      <div class="card__header" data-ref="forgot-header">
        <h1 class="card__title" data-ref="forgot-title">¿Olvidaste tu contraseña?</h1>
        <p class="card__subtitle" data-ref="forgot-subtitle">Ingresa tu correo electrónico para enviarte las instrucciones de recuperación</p>
      </div>

      <div class="card__body" data-ref="forgot-form">
        <label class="field" data-ref="field-forgot-email">
          <input class="field__input" data-ref="forgot-email" type="email" placeholder=" " autocomplete="email" />
          <span class="field__label" data-ref="label-forgot-email">Correo electrónico</span>
        </label>

        <button type="button" class="btn btn--h55 btn--black btn--w-full" data-ref="btn-submit-forgot">
          Continuar
        </button>

        <p class="footer-note" data-ref="forgot-footer">
          ¿Recordaste tu contraseña? <a class="link link--primary" data-ref="btn-forgot-to-login" href="/login">Iniciar sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
