<div class="layout-header" data-ref="topbar">
  <div class="layout-header__left" data-ref="topbar-left">
    <button type="button" class="btn btn--h40 btn--icon" data-ref="btn-toggle-menu" data-i18n-tooltip="nav.menu" data-i18n-aria="nav.menu">
      <span class="material-symbols-rounded">menu</span>
    </button>
  </div>

  <div class="layout-header__center" data-ref="topbar-center">
    <div class="component-search" data-ref="topbar-search">
      <div class="component-search__icon" data-ref="topbar-search-icon">
        <span class="material-symbols-rounded">search</span>
      </div>
      <div class="component-search__input-box" data-ref="topbar-search-input-box">
        <input class="component-search__input" data-ref="topbar-search-input" data-i18n-placeholder="topbar.search_placeholder" type="text" autocomplete="off" />
      </div>
    </div>
  </div>

  <div class="layout-header__right" data-ref="topbar-right">
    <button type="button" class="btn btn--h40 btn--icon btn-search-mobile" data-ref="btn-mobile-search" data-i18n-tooltip="topbar.search_tooltip" data-i18n-aria="topbar.search_tooltip">
      <span class="material-symbols-rounded">search</span>
    </button>

    <!-- Contenido dinámico inyectado por TopBar JS (botón login o avatar dropdown) -->
    <div class="avatar-dropdown-container" data-ref="avatar-container" style="display: none;">
      <button type="button" class="btn--avatar" data-ref="btn-avatar" data-i18n-tooltip="topbar.user_profile_tooltip" data-i18n-aria="topbar.user_profile_tooltip">
        <img class="avatar-img" data-ref="avatar-img" src="" alt="Avatar" referrerpolicy="no-referrer" />
      </button>

      <div class="avatar-dropdown-backdrop" data-ref="avatar-menu-backdrop">
        <div class="menu-panel menu-panel--dropdown menu-panel--w-265 menu-panel--h-auto" data-ref="avatar-menu">
          <div class="menu-panel__drag-zone" data-ref="avatar-menu-drag-zone">
            <div class="menu-panel__drag-handle"></div>
          </div>
          <div class="menu-panel__list" data-ref="avatar-menu-list">
            <button type="button" class="menu-item" data-ref="btn-menu-settings">
              <span class="material-symbols-rounded menu-item__icon">settings</span>
              <span class="menu-item__text" data-i18n="nav.settings"></span>
            </button>
            <button type="button" class="menu-item" data-ref="btn-menu-help">
              <span class="material-symbols-rounded menu-item__icon">help</span>
              <span class="menu-item__text" data-i18n="nav.help"></span>
            </button>
            <button type="button" class="menu-item menu-item--bordered menu-item--danger" data-ref="btn-logout">
              <span class="material-symbols-rounded menu-item__icon">logout</span>
              <span class="menu-item__text" data-i18n="nav.logout"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <button type="button" class="btn btn--h40 btn--black" data-ref="btn-login" data-i18n="nav.login" style="display: none;">
    </button>
  </div>
</div>
