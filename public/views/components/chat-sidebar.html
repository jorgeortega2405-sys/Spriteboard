<div class="chat-sidebar" data-ref="chat-sidebar">
  <div class="chat-panel" data-ref="chat-panel">
    <div class="chat-gradient-backdrop" data-ref="chat-gradient-backdrop"></div>
    <div class="chat-panel__top" data-ref="chat-panel-top">
      <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="btn-chat-history" data-i18n-tooltip="chat.history" aria-label="Historial de chats">
        <span class="material-symbols-rounded">history</span>
      </button>

      <button type="button" class="component-button component-button--h40 component-button--icon-only" data-ref="btn-chat-close" data-i18n-tooltip="chat.close" aria-label="Cerrar chat">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <div class="chat-support-banner" data-ref="chat-support-banner" style="display: none; padding: 10px 14px; background-color: var(--bg-surface); border-bottom: 1px solid var(--border-color); z-index: 2; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="material-symbols-rounded" style="font-size: 18px; color: var(--action-primary);">support_agent</span>
          <span style="font-size: 13px; font-weight: 600; color: var(--text-primary);" data-ref="chat-support-ticket-num">Soporte Técnico</span>
        </div>
        <button type="button" class="component-button component-button--ghost component-button--h24" data-ref="btn-chat-cancel-support" style="font-size: 11px; padding: 2px 8px; color: var(--text-tertiary);" aria-label="Finalizar soporte">
          Finalizar
        </button>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
        <div class="component-badge component-badge--info" data-ref="chat-support-status-pill" style="font-size: 11px; padding: 2px 8px; font-weight: 600;">
          En cola de espera
        </div>
        <span style="font-size: 11px; color: var(--text-secondary);" data-ref="chat-support-wait-time">Buscando agente...</span>
      </div>
    </div>

    <div class="chat-panel__center layout-scrollable" data-ref="chat-panel-center">
      <div class="chat-messages" data-ref="chat-messages">
        <div class="chat-empty-state" data-ref="chat-empty-state">
          <h3 class="chat-empty-state__title" data-i18n="chat.empty_title">Obtén ayuda para lo que necesites en Spriteboard</h3>
          <p class="chat-empty-state__desc" data-i18n="chat.empty_desc">Respuestas rápidas con tecnología de IA</p>
        </div>
      </div>
    </div>

    <div class="chat-panel__bottom" data-ref="chat-panel-bottom">
      <div class="chat-pill-input" data-ref="chat-input-box">
        <textarea class="chat-pill-input__field" data-ref="chat-input" data-i18n-placeholder="chat.input_placeholder" placeholder="Escribe un mensaje..." rows="1" maxlength="2000"></textarea>
        <button type="button" class="component-button component-button--icon-only chat-pill-input__btn" data-ref="btn-chat-send" data-i18n-tooltip="chat.send" aria-label="Enviar mensaje">
          <span class="material-symbols-rounded">send</span>
        </button>
      </div>
      <p class="chat-disclaimer" data-i18n="chat.disclaimer">La IA puede cometer errores, verifica que la información sea correcta.</p>
    </div>
  </div>
</div>
