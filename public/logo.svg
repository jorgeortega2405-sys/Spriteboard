    <linearGradient id="text-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="text-secondary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
  </defs>
  <!-- Stylized Wordmark -->
  <text x="0" y="28" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" letter-spacing="-1.2">
    <tspan font-weight="800" fill="url(#text-primary)">Sprite</tspan><tspan font-weight="500" fill="url(#text-secondary)">board</tspan>
  </text>
  <!-- Distintivo característico: acento moderno -->
  <rect x="178" y="10" width="3.5" height="17" rx="1.75" fill="#09090b" transform="rotate(16 178 10)" />
