<div class="layout-content" data-ref="admin-test-view">
  <div class="component-wrapper component-wrapper--full view-wrapper" data-ref="test-wrapper">
    <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="test-scrollable">
      <div class="view-body" data-ref="test-container">
        <div class="view-backdrop" data-ref="test-backdrop"></div>
        <div class="view-header" data-ref="test-header">
          <div class="view-header__left" data-ref="test-header-left">
            <h1 class="view-header__title" data-ref="test-title">Página de Prueba</h1>
          </div>
        </div>

        <div class="view-hero" data-ref="test-hero">
          <div class="view-hero__content" style="max-width: 720px; margin: 0 auto; text-align: center; padding: 40px 20px;">
            <div class="admin-welcome-card" data-ref="admin-test-card" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg, 16px); padding: 32px 24px; box-shadow: var(--shadow-sm);">
              <div class="admin-avatar-badge" data-ref="admin-test-icon-badge" style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: var(--bg-card-subtle); border: 1px solid var(--border-color); margin-bottom: 16px;">
                <svg class="component-icon" style="width: 32px; height: 32px; color: var(--color-brand, #ea580c);" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
              </div>

              <h1 class="view-hero__title" data-ref="test-headline" style="margin-bottom: 8px; font-size: 28px;">
                Navegación SPA de Prueba
              </h1>
              <p class="card__subtitle" data-ref="test-subtitle" style="margin-bottom: 24px;">
                Esta vista confirma que el cambio dinámico de rutas y el sistema de navegación modular en el panel de administración funcionan correctamente.
              </p>

              <div class="admin-test-actions" data-ref="admin-test-actions" style="display: flex; justify-content: center; gap: 12px; margin-top: 16px;">
                <button type="button" class="component-button component-button--h45 component-button--primary" data-ref="btn-test-go-home">
                  <svg class="component-icon" aria-hidden="true" style="margin-right: 8px;"><use href="/icons.svg#home"></use></svg>
                  <span>Volver a Inicio</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
