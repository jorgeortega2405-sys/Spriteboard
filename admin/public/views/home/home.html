<div class="layout-content" data-ref="admin-home-view">
  <div class="component-wrapper component-wrapper--full view-wrapper" data-ref="home-wrapper">
    <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="home-scrollable">
      <div class="view-body" data-ref="home-container" style="width: 100%; max-width: 100%; box-sizing: border-box; padding: 24px 28px 60px;">
        <div class="view-header" data-ref="home-header">
          <div class="view-header__left" data-ref="home-header-left">
            <h1 class="view-header__title" data-ref="home-title">Panel de Administración</h1>
          </div>
        </div>

        <div class="view-hero" data-ref="home-hero">
          <div class="view-hero__content" style="width: 100%; max-width: 100%; text-align: center; padding: 20px 0;">
            <div class="admin-welcome-card" data-ref="admin-welcome-card" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg, 16px); padding: 32px 24px; box-shadow: var(--shadow-sm);">
              <div class="admin-avatar-badge" data-ref="admin-avatar-badge" style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: var(--bg-card-subtle); border: 1px solid var(--border-color); margin-bottom: 16px;">
                <svg class="component-icon" style="width: 32px; height: 32px; color: var(--color-brand, #ea580c);" aria-hidden="true"><use href="/icons.svg#admin_panel_settings"></use></svg>
              </div>

              <h1 class="view-hero__title" data-ref="admin-welcome-title" style="margin-bottom: 8px; font-size: 28px;">
                Hola <span data-ref="admin-user-name" style="color: var(--color-brand, #ea580c);"></span>
              </h1>
              <p class="card__subtitle" data-ref="admin-welcome-subtitle" style="margin-bottom: 24px;">
                Bienvenido al centro de administración de Spriteboard.
              </p>

              <div class="admin-roles-container" data-ref="admin-roles-container" style="text-align: left; background: var(--bg-card-subtle); border-radius: var(--radius-md, 12px); padding: 20px; border: 1px solid var(--border-color-subtle, var(--border-color));">
                <div class="admin-roles-header" data-ref="admin-roles-header" style="display: flex; align-items: center; gap: 8px; margin-bottom: 14px;">
                  <svg class="component-icon" style="width: 20px; height: 20px; color: var(--text-secondary);" aria-hidden="true"><use href="/icons.svg#badge"></use></svg>
                  <span style="font-weight: 600; font-size: 15px; color: var(--text-primary);">Tus roles asignados:</span>
                </div>
                <div class="admin-roles-badges" data-ref="admin-roles-list" style="display: flex; flex-wrap: wrap; gap: 8px;">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
