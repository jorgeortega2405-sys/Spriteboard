<div class="layout-content" data-ref="login-view">
  <div class="login-container" data-ref="login-wrapper">
    <a class="login-header-logo" data-ref="login-home-link" href="/" aria-label="Spriteboard Admin">
      <img class="login-logo-img" data-ref="logo-img" src="/logo.svg" alt="Spriteboard" />
    </a>

    <div class="card card--w-400" data-ref="login-card">
      <div class="auth-step" data-ref="login-step-main">
        <div class="card__header" data-ref="login-header">
          <h1 class="card__title" data-ref="login-title">Administración</h1>
          <p class="card__subtitle" data-ref="login-subtitle">Inicia sesión con tu cuenta de administrador</p>
        </div>

        <div class="card__body" data-ref="login-form">
          <label class="field" data-ref="field-login-email">
            <input class="field__input" data-ref="login-email" type="email" maxlength="254" placeholder=" " autocomplete="email" />
            <span class="field__label" data-ref="label-login-email">Correo electrónico</span>
          </label>

          <label class="field" data-ref="field-login-password">
            <input class="field__input field__input--has-action" data-ref="login-password" type="password" maxlength="128" placeholder=" " autocomplete="current-password" />
            <span class="field__label" data-ref="label-login-password">Contraseña</span>
            <button type="button" class="field__action" data-ref="toggle-login-password" aria-label="Mostrar u ocultar contraseña">
              <span class="material-symbols-rounded">visibility</span>
            </button>
          </label>

          <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-login">
            Iniciar sesión
          </button>

          <button type="button" class="component-button component-button--h55 component-button--outline component-button--w-full" data-ref="btn-google-login">
            <svg class="google-icon" data-ref="google-icon" width="20" height="20" viewBox="0 0 24 24" style="margin-right: 10px;">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="component-button__text" data-ref="google-btn-text">Continuar con Google</span>
          </button>

          <div class="banner banner--danger" data-ref="login-error" style="display: none;"></div>
        </div>
      </div>

      <div class="auth-step" data-ref="login-step-2fa" style="display: none;">
        <div class="card__header" data-ref="login-2fa-header">
          <h1 class="card__title" data-ref="login-2fa-title">Verificación en dos pasos</h1>
          <p class="card__subtitle" data-ref="login-2fa-subtitle">
            <span data-ref="verify-2fa-subtitle-text">Introduce el código de tu aplicación de autenticación</span>
          </p>
        </div>

        <div class="card__body" data-ref="login-2fa-form">
          <label class="field" data-ref="field-login-2fa-code">
            <input class="field__input field__input--code" data-ref="input-login-2fa-code" type="text" maxlength="9" placeholder=" " autocomplete="one-time-code" />
            <span class="field__label" data-ref="label-login-2fa-code">Código de 6 dígitos</span>
          </label>

          <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-2fa">
            Verificar código
          </button>

          <div class="banner banner--danger" data-ref="login-2fa-error" style="display: none;"></div>

          <div class="link-row" data-ref="login-2fa-back-row" style="justify-content: center; margin-top: 14px;">
            <a class="link" data-ref="btn-back-to-login" href="/login">Volver al inicio de sesión</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
