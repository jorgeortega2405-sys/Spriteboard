<div class="layout-content" data-ref="login-view">
  <div class="login-container" data-ref="login-wrapper">
    <a class="login-header-logo" data-ref="login-home-link" data-i18n-aria="admin.auth.app_aria" href="/" aria-label="Spriteboard Admin">
      <img class="login-logo-img" data-ref="logo-img" src="/logo.svg" alt="Spriteboard" />
    </a>

    <div class="card card--w-400" data-ref="login-card">
      <div class="auth-step" data-ref="login-step-main">
        <div class="card__header" data-ref="login-header">
          <h1 class="card__title" data-ref="login-title" data-i18n="admin.auth.title">Administración</h1>
          <p class="card__subtitle" data-ref="login-subtitle" data-i18n="admin.auth.subtitle">Inicia sesión con tu cuenta de administrador</p>
        </div>

        <div class="card__body" data-ref="login-form">
          <label class="field" data-ref="field-login-email">
            <input class="field__input" data-ref="login-email" type="email" maxlength="254" placeholder=" " autocomplete="email" />
            <span class="field__label" data-ref="label-login-email" data-i18n="auth.login.email_label">Correo electrónico</span>
          </label>

          <label class="field" data-ref="field-login-password">
            <input class="field__input field__input--has-action" data-ref="login-password" type="password" maxlength="128" placeholder=" " autocomplete="current-password" />
            <span class="field__label" data-ref="label-login-password" data-i18n="auth.login.password_label">Contraseña</span>
            <button type="button" class="field__action" data-ref="toggle-login-password" data-i18n-aria="auth.login.toggle_password" aria-label="Mostrar u ocultar contraseña">
              <span class="material-symbols-rounded">visibility</span>
            </button>
          </label>

          <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-login" data-i18n="admin.auth.submit_btn">
            Iniciar sesión
          </button>

          <button type="button" class="component-button component-button--h55 component-button--outline component-button--w-full" data-ref="btn-google-login">
            <svg class="google-icon" data-ref="google-icon" width="20" height="20" aria-hidden="true" style="margin-right: 10px;"><use href="/icons.svg#google_colored"></use></svg>
            <span class="component-button__text" data-ref="google-btn-text" data-i18n="auth.login.google_btn">Continuar con Google</span>
          </button>

          <div class="banner banner--danger" data-ref="login-error" style="display: none;"></div>
        </div>
      </div>

      <div class="auth-step" data-ref="login-step-2fa" style="display: none;">
        <div class="card__header" data-ref="login-2fa-header">
          <h1 class="card__title" data-ref="login-2fa-title" data-i18n="auth.login_2fa.title">Verificación en dos pasos</h1>
          <p class="card__subtitle" data-ref="login-2fa-subtitle">
            <span data-ref="verify-2fa-subtitle-text" data-i18n="admin.auth.two_factor_subtitle">Introduce el código de tu aplicación de autenticación</span>
          </p>
        </div>

        <div class="card__body" data-ref="login-2fa-form">
          <label class="field" data-ref="field-login-2fa-code">
            <input class="field__input field__input--code" data-ref="input-login-2fa-code" type="text" maxlength="9" placeholder=" " autocomplete="one-time-code" />
            <span class="field__label" data-ref="label-login-2fa-code" data-i18n="auth.register_stage3.code_label">Código de 6 dígitos</span>
          </label>

          <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-2fa" data-i18n="admin.auth.verify_btn">
            Verificar código
          </button>

          <div class="banner banner--danger" data-ref="login-2fa-error" style="display: none;"></div>

          <div class="link-row" data-ref="login-2fa-back-row" style="justify-content: center; margin-top: 14px;">
            <a class="link" data-ref="btn-back-to-login" data-i18n="auth.login_2fa.back_to_login" href="/login">Volver al inicio de sesión</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
