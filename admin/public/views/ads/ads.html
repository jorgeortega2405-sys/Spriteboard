<div class="layout-content" data-ref="ads-view">
  <div class="component-wrapper component-wrapper--full view-wrapper" data-ref="ads-wrapper">
    <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="ads-scrollable">
      <div class="view-header" data-ref="ads-floating-top">
        <div class="view-header__left" data-ref="ads-floating-left">
          <h1 class="view-header__title" data-ref="ads-title">Gestión de Anuncios</h1>
        </div>

        <div class="view-header__right" data-ref="ads-floating-right">
          <div class="view-header__actions" data-ref="ads-default-actions">
            <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-toggle-search" data-tooltip="Buscar anunciantes" aria-label="Buscar anunciantes">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
            </button>

            <div class="settings-dropdown-wrapper" data-ref="filter-dropdown-wrapper">
              <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-toggle-filter" data-tooltip="Filtros" aria-label="Filtros">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
              </button>

              <div class="dropdown-backdrop" data-ref="filter-dropdown-backdrop">
                <div class="menu-panel menu-panel--dropdown menu-panel--w-285 menu-panel--h-auto" data-ref="filter-dropdown-menu">
                  <div class="avatar-menu__section-header">
                    <span class="drawer-section__title">Tipo de Anunciante</span>
                  </div>
                  <div class="menu-panel__list" data-ref="filter-type-list">
                    <button type="button" class="menu-item is-active" data-ref="filter-type-all" data-type="all">
                      <span class="menu-item__text">Todos los tipos</span>
                    </button>
                    <button type="button" class="menu-item" data-ref="filter-type-direct" data-type="direct">
                      <span class="menu-item__text">Anunciante directo</span>
                    </button>
                    <button type="button" class="menu-item" data-ref="filter-type-provider" data-type="provider">
                      <span class="menu-item__text">Red / Proveedor (Google AdSense)</span>
                    </button>
                  </div>


                  <div class="menu-divider"></div>

                  <div class="avatar-menu__section-header">
                    <span class="drawer-section__title">Estado</span>
                  </div>
                  <div class="menu-panel__list" data-ref="filter-status-list">
                    <button type="button" class="menu-item is-active" data-ref="filter-status-all" data-status="all">
                      <span class="menu-item__text">Todos</span>
                    </button>
                    <button type="button" class="menu-item" data-ref="filter-status-active" data-status="active">
                      <span class="menu-item__text">Activo</span>
                    </button>
                    <button type="button" class="menu-item" data-ref="filter-status-inactive" data-status="inactive">
                      <span class="menu-item__text">Inactivo</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <button type="button" class="component-button component-button--h40 component-button--black view-header__btn" data-ref="btn-create-advertiser" data-tooltip="Crear anunciante" aria-label="Crear anunciante">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#add"></use></svg>
              <span>Crear Anunciante</span>
            </button>

            <div class="component-inline-control component-inline-control--fixed component-inline-control--pagination" data-ref="pagination-inline-control">
              <div class="component-inline-control__group" data-ref="inline-group-page-prev">
                <button type="button" class="component-inline-control__btn" data-ref="btn-pagination-prev" data-tooltip="Página anterior" aria-label="Página anterior" disabled>
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_left"></use></svg>
                </button>
              </div>
              <input class="component-inline-control__input" data-ref="input-pagination-page" type="number" min="1" max="1" value="1" autocomplete="off" />
              <div class="component-inline-control__group" data-ref="inline-group-page-next">
                <button type="button" class="component-inline-control__btn" data-ref="btn-pagination-next" data-tooltip="Página siguiente" aria-label="Página siguiente" disabled>
                  <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_right"></use></svg>
                </button>
              </div>
            </div>
          </div>

          <div class="view-header__actions" data-ref="ads-selected-actions" style="display: none; align-items: center; gap: 8px;">
            <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-deselect" data-tooltip="Cancelar selección" aria-label="Cancelar selección">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
            </button>

            <button type="button" class="component-button component-button--h40 component-button--black view-header__btn" data-ref="btn-action-manage-ads" data-tooltip="Gestionar anuncios" aria-label="Gestionar anuncios">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#campaign"></use></svg>
              <span>Gestionar Anuncios</span>
            </button>


            <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-edit-advertiser" data-tooltip="Editar anunciante" aria-label="Editar anunciante">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#edit"></use></svg>
            </button>

            <button type="button" class="component-button component-button--h40 component-button--icon-only component-button--danger view-header__btn" data-ref="btn-action-delete-advertiser" data-tooltip="Eliminar anunciante" aria-label="Eliminar anunciante">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete"></use></svg>
            </button>
          </div>
        </div>


        <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
          <div class="component-search component-search--full" data-ref="search-box">
            <div class="component-search__icon" data-ref="search-icon">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
            </div>
            <div class="component-search__input-box" data-ref="search-input-box">
              <input class="component-search__input" data-ref="ads-search-input" placeholder="Buscar_por_nombre, sitio web o correo..." type="text" maxlength="100" autocomplete="off" />
            </div>
            <button type="button" class="component-button component-button--h34 component-button--icon-only" data-ref="btn-clear-search" style="display: none; margin-right: 4px;" aria-label="Limpiar bñsqueda">
              <svg class="component-icon" aria-hidden="true" style="font-size: 18px;"><use href="/icons.svg#close"></use></svg>
            </button>
          </div>
        </div>
      </div>


      <div class="component-table-wrapper" data-ref="ads-table-wrapper" style="display: flex; flex-direction: column; height: calc(100% - 56px);">
        <div class="table-scroll-container" style="flex: 1; overflow: auto;">
          <table class="component-table" data-ref="advertisers-table">
            <thead class="component-table__head" data-ref="advertisers-thead">
              <tr>
                <th data-ref="th-name">Anunciante</th>
                <th data-ref="th-type">Tipo</th>
                <th data-ref="th-contact">Contacto / Web</th>
                <th data-ref="th-ads">Anuncios</th>
                <th data-ref="th-status">Estado</th>
                <th data-ref="th-created">Fecha Registro</th>
              </tr>
            </thead>
            <tbody class="component-table__body" data-ref="advertisers-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
