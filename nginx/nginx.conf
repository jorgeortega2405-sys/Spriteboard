user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/xml+rss image/svg+xml;

    # Upstreams de Servicios
    upstream backend_app {
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream websocket_srv {
        server websocket:3001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream admin_app {
        server admin:3002 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
